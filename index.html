<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>스케일 리더 브랜치</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="only dark">
<meta name="supported-color-schemes" content="dark">
<meta name="darkreader-lock">
<meta name="theme-color" content="#121110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&family=Share+Tech+Mono&family=Yellowtail&display=swap">
<style>
/* Layout: 고정된 하드웨어 상판(헤더·이조 뱅크·디스플레이·우드 케이스 건반) + 스크롤되는 모듈 랙 + 하단 컨트롤 스트립
   단일 다크 룩 고정 — 시스템 라이트/다크 설정과 무관 */
:root{
  color-scheme:only dark;
  --tolex:#121110;      /* 케이스 바탕 */
  --plate:#1f1d1a;      /* 브러시드 페이스플레이트 */
  --well:#0d0c0b;       /* 움푹 들어간 영역 */
  --legend:#eadfc4;     /* 크림색 각인 */
  --legend-dim:#a09682;
  --legend-faint:#6c6557;
  --amber:#ffb347;      /* 램프 · 선택 */
  --vfd:#62f0cd;        /* VFD · 재생 */
  --vfd-dim:#2b7a68;
  --red:#e2503a;
  --paper:#ece2c9;
  --ink:#2c251b;
  --ink-dim:#6d6050;
  --ink-red:#a8321d;
  --f-label:"Saira Semi Condensed","Arial Narrow","Roboto Condensed","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-vfd:"Share Tech Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-script:"Yellowtail","Brush Script MT","Segoe Script",cursive;
  --f-ko:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--tolex);height:100%;overscroll-behavior:none}
@media (prefers-color-scheme: dark){ :root{color-scheme:only dark} html,body{background-color:var(--tolex)} }
@media (prefers-color-scheme: light){ :root{color-scheme:only dark} html,body{background-color:var(--tolex)} }
body{margin:0;color:var(--legend);
  background-color:var(--tolex);
  background-image:radial-gradient(rgba(255,255,255,.028) 1px,transparent 1.3px),
                   radial-gradient(rgba(0,0,0,.35) 1px,transparent 1.3px);
  background-size:3px 3px,4px 4px;background-position:0 0,1px 2px;
  height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none;
  padding:calc(6px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
          calc(6px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  font-family:var(--f-ko);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none}
button{font:inherit;color:inherit;background:none;border:none;margin:0;padding:0;cursor:pointer;
       touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.wrap{max-width:1040px;margin:0 auto;height:100%;display:flex;flex-direction:column;min-height:0;gap:6px}
#top{flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
#results{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
         scrollbar-width:none;padding:2px 0 6px}
#results::-webkit-scrollbar{display:none}

/* ── 브러시드 메탈 패널 ── */
.unit{position:relative;border-radius:6px;border:1px solid #070605;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,rgba(0,0,0,.035) 1px 2px,transparent 2px 4px),
    linear-gradient(180deg,#2c2925 0%,#201e1b 55%,#1a1816 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -1px 0 rgba(0,0,0,.55),
             0 2px 0 #070605,0 4px 10px rgba(0,0,0,.45)}
.screw{position:absolute;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#a29b8e,#4a453e 62%,#26231f);
  box-shadow:0 0 0 1px #090807,inset 0 0 1px rgba(0,0,0,.8)}
.screw::after{content:"";position:absolute;left:1px;right:1px;top:3px;height:1px;background:#14120f;
  transform:rotate(var(--r,38deg))}
.lg{font-family:var(--f-label);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--legend);text-shadow:0 1px 0 #000}

/* ── 헤더 ── */
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 12px 7px 20px}
.head .screw.a{left:6px;top:7px;--r:20deg}
.head .screw.b{left:6px;bottom:7px;--r:-50deg}
.brand{min-width:0;display:flex;flex-direction:column;gap:1px}
.script{font-family:var(--f-script);font-size:27px;line-height:1;letter-spacing:.01em;white-space:nowrap;
  background:linear-gradient(180deg,#fffaf0 0%,#e2d6bb 45%,#a89c84 58%,#efe6d2 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 #000) drop-shadow(0 0 1px rgba(0,0,0,.6))}
.model{font-family:var(--f-label);font-size:9.5px;font-weight:600;letter-spacing:.2em;color:var(--legend-dim);
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kname{font-size:11px;color:var(--legend-dim);white-space:nowrap}
.brtag{display:inline-block;margin-left:5px;padding:0 5px;border-radius:2px;border:1px solid #6b4a14;
  color:var(--amber);font-size:9.5px;font-weight:600;line-height:14px;vertical-align:1px}

/* 볼륨 노브 (브리티시 콘솔 타입) */
.hctl{--kw:72px;flex:0 0 auto;display:flex;align-items:flex-start;gap:6px}
.hline{flex:0 0 auto;width:10px;height:1.6px;margin-top:calc(var(--kw)*.4914 - .8px);background:#c9c7c2;opacity:.75}
.sbtn{flex:0 0 auto;display:flex;margin-top:calc(var(--kw)*.4914 - 16px)}
.hctl .vu{align-self:center}
.sbtn .litbtn{width:32px;height:32px}
.slab{font-family:var(--f-label);font-size:8.5px;font-weight:600;letter-spacing:.14em;color:#c9c7c2;text-shadow:0 1px 0 #000}
.sbtn:active .lens{transform:scale(.94)}
.knob{flex:0 0 auto;width:var(--kw);touch-action:none;cursor:ns-resize;border-radius:50%}
.knob svg{display:block;width:100%;height:auto}
.knob:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media(max-width:420px){.script{font-size:22px}.vu{width:94px}.hctl{--kw:62px;gap:4px}.hline{width:6px}.head{gap:6px;padding-right:10px}.model{display:none}}
/* 헤더 미니 컨트롤 (MODE · FULL · RESET) */
.minis{display:flex;align-items:flex-end;gap:4px;margin-top:5px;margin-left:-4px}
.mini{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:36px;min-height:40px;padding:2px 0;border-radius:4px}
.mini:active{background:rgba(255,255,255,.04)}
.mlab{font-family:var(--f-label);font-size:8px;font-weight:600;letter-spacing:.12em;line-height:1;color:#c9c7c2;text-shadow:0 1px 0 #000}
.mlab.on{color:var(--amber);text-shadow:0 0 5px rgba(255,179,71,.6)}
.tog.sm{width:16px;height:26px}
.tog.sm .lever{width:5px;height:11px;margin-left:-2.5px}
.tog.sm .lever::before{width:7px;height:7px;left:-1px;top:-3px}
.tog.sm .nut{width:11px;height:11px;margin:-5.5px 0 0 -5.5px}
.cap.sm{width:22px;height:22px;margin-bottom:2px}
.cap.sm svg{width:10px;height:10px}
.mini:active .cap{transform:translateY(1px) scale(.96);filter:brightness(.85)}
/* VU 미터 */
.vu{flex:0 0 auto;width:110px;padding:3px;border-radius:5px;
  background:linear-gradient(180deg,#0a0908,#2b2723);
  box-shadow:inset 0 1px 2px #000,0 1px 0 rgba(255,255,255,.08)}
.vu svg{display:block;width:100%;height:auto;border-radius:2px;transition:filter .3s}
.vu.dim svg{filter:brightness(.42) saturate(.5)}
.vu #peak{fill:#4a1710;transition:fill .05s}
.vu.peak #peak{fill:#ff5a3a}

/* ── 이조 뱅크 ── */
.bank{padding:6px}
.tbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tbtn{position:relative;min-height:46px;border-radius:4px;padding:8px 3px 5px;text-align:center;
  border:1px solid #070605;color:var(--legend-dim);
  background:linear-gradient(180deg,#3b3732 0%,#2b2824 55%,#24211d 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 2px 0 #080706;
  transition:transform .06s,box-shadow .06s}
.tbtn .tl{position:absolute;left:28%;right:28%;top:4px;height:3px;border-radius:2px;background:#3a2a12;
  box-shadow:inset 0 0 1px #000}
.tbtn b{display:block;font-family:var(--f-label);font-size:17px;font-weight:700;line-height:1.1;letter-spacing:.02em;color:var(--legend)}
.tbtn i{display:block;font-style:normal;font-family:var(--f-label);font-size:10px;font-weight:500;letter-spacing:.06em;
  line-height:1.2;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn:active{transform:translateY(1px)}
.tbtn.on{transform:translateY(1px);color:var(--amber);
  background:linear-gradient(180deg,#2a2622,#211e1b);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.65),0 1px 0 #080706}
.tbtn.on .tl{background:var(--amber);box-shadow:0 0 5px var(--amber),0 0 12px rgba(255,179,71,.5)}
.tbtn.on b{color:#ffd8a0;text-shadow:0 0 8px rgba(255,179,71,.35)}
.tnote{font-size:10.5px;color:var(--legend-faint);padding:5px 2px 0;line-height:1.35}
.tnote .lg{font-size:9.5px;color:var(--legend-dim);letter-spacing:.16em;margin-right:5px}

/* ── 테이프 라벨 기록 ── */
.hist{position:relative;height:26px;display:flex;align-items:center;gap:7px}
.hwrap{position:relative;flex:1 1 auto;min-width:0;height:100%}
.hscroll{display:flex;align-items:center;gap:6px;height:100%;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.hwrap::before,.hwrap::after{content:"";position:absolute;top:0;bottom:0;width:26px;z-index:2;pointer-events:none;opacity:0;transition:opacity .15s}
.hwrap::before{left:0;background:linear-gradient(to right,var(--tolex) 10%,rgba(18,17,16,0))}
.hwrap::after{right:0;background:linear-gradient(to left,var(--tolex) 10%,rgba(18,17,16,0))}
.hwrap.can-l::before{opacity:1}
.hwrap.can-r::after{opacity:1}
.hc{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 10px;white-space:nowrap;
  font-size:11.5px;font-weight:600;color:var(--ink);
  background:linear-gradient(180deg,rgba(240,231,207,.96),rgba(222,210,180,.96));
  clip-path:polygon(2px 0,calc(100% - 3px) 0,100% 22%,calc(100% - 2px) 48%,100% 76%,calc(100% - 3px) 100%,3px 100%,0 72%,2px 46%,0 20%)}
.hc:active{filter:brightness(.88)}
.hd{width:6px;height:6px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.hd-chord{background:#14917a}
.hd-scale{background:#d08414}
.hd-mode{background:#6c6557}
.hd-keys{background:#b0a68f}
.hclr{flex:0 0 auto;display:none;align-items:center;gap:4px;height:24px;padding:0 2px 0 9px;
  border-left:1px solid #2c2925;color:#b98a7c;font-size:11px;white-space:nowrap}
.hclr.on{display:inline-flex}
.hclr.arm{color:#ff9a86;font-weight:600}
.hempty{font-size:10.5px;color:var(--legend-faint);white-space:nowrap;padding-left:2px}

/* ── 입력 슬롯 ── */
.sbwrap{position:relative}
.sb{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;border-radius:5px;background:var(--well);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.85),inset 0 0 0 1px #000,0 1px 0 rgba(255,255,255,.07)}
.sb:focus-within{box-shadow:inset 0 2px 5px rgba(0,0,0,.85),inset 0 0 0 1px #6b4a14,0 0 0 1px rgba(255,179,71,.25)}
.sb svg{flex:0 0 auto;color:var(--legend-dim)}
.sb input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--legend);caret-color:var(--amber);
  font-size:15px;font-family:var(--f-ko);padding:0;-webkit-appearance:none;appearance:none}
.sb input::placeholder{color:var(--legend-faint)}
.sbclr{display:none;width:28px;height:28px;align-items:center;justify-content:center;color:var(--legend-dim);font-size:13px}
.sbclr.on{display:flex}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:60;border-radius:6px;max-height:46vh;overflow-y:auto;
  background:linear-gradient(180deg,#25221f,#1b1916);border:1px solid #3a352e;
  box-shadow:0 16px 34px rgba(0,0,0,.75);display:none;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg.open{display:block}
.sg{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid #12100e;box-shadow:0 1px 0 rgba(255,255,255,.03);cursor:pointer}
.sg:last-child{border-bottom:none}
.sg.sel{background:#2f2b26}
.sgkind{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;font-size:10px;color:var(--legend-dim);width:48px}
.sgkind::before{content:"";width:6px;height:6px;border-radius:50%}
.k-chord::before{background:var(--vfd);box-shadow:0 0 5px var(--vfd)}
.k-scale::before{background:var(--amber);box-shadow:0 0 5px var(--amber)}
.k-mode::before{background:var(--legend);box-shadow:0 0 4px rgba(234,223,196,.6)}
.sgname{font-family:var(--f-label);font-size:14.5px;font-weight:600;color:var(--legend)}
.sgko{font-size:10.5px;color:var(--legend-faint);margin-left:6px}
.sgnotes{margin-left:auto;font-family:var(--f-vfd);font-size:11px;color:var(--legend-dim);white-space:nowrap}
.sgempty{padding:12px;font-size:12px;color:var(--legend-dim)}
@media(max-width:430px){.sgnotes{display:none}}

/* ── VFD 디스플레이 ── */
.display{padding:4px;border-radius:6px;background:linear-gradient(180deg,#090807,#24211d);
  box-shadow:inset 0 1px 2px #000,0 1px 0 rgba(255,255,255,.07)}
.glass{position:relative;overflow:hidden;border-radius:3px;min-height:64px;padding:7px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:radial-gradient(130% 160% at 50% 0%,#0e1f1b 0%,#06100d 55%,#040807 100%);
  box-shadow:inset 0 0 14px rgba(0,0,0,.9)}
.glass::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
.glass::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(168deg,rgba(255,255,255,.075) 0%,rgba(255,255,255,0) 38%)}
.dl{min-width:0;flex:1 1 auto;position:relative;z-index:1}
.dr{flex:0 0 auto;text-align:right;position:relative;z-index:1}
.vlab{font-family:var(--f-label);font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--vfd-dim)}
.vnotes{display:flex;flex-wrap:wrap;gap:2px 9px;margin-top:2px;font-family:var(--f-vfd);font-size:17px;color:var(--vfd);
  text-shadow:0 0 4px rgba(98,240,205,.75),0 0 10px rgba(98,240,205,.3)}
.vsub{font-family:var(--f-vfd);font-size:11px;color:var(--vfd-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vmsg{font-size:12px;line-height:1.4;color:#3fa58c;margin-top:3px}
.vhead{font-family:var(--f-vfd);font-size:32px;line-height:1.05;color:var(--vfd);letter-spacing:.01em;
  text-shadow:0 0 5px rgba(98,240,205,.85),0 0 14px rgba(98,240,205,.35)}
.vhead.ghost{color:#123a31;text-shadow:none}

/* ── 우드 케이스 건반 ── */
.kbcase{display:flex;border-radius:7px;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.05),0 5px 12px rgba(0,0,0,.6)}
.cheek{flex:0 0 12px;
  background:
    repeating-linear-gradient(178deg,rgba(0,0,0,.20) 0 2px,transparent 2px 6px,rgba(255,220,180,.05) 6px 7px,transparent 7px 11px),
    linear-gradient(90deg,#3a2112 0%,#7a4a2a 35%,#8d5833 55%,#5a341c 85%,#2f1a0e 100%)}
.kbbed{flex:1 1 auto;min-width:0;background:#0c0b0a;display:flex;flex-direction:column}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
#kbscroll{padding:6px 6px 7px;background:linear-gradient(180deg,#4e1414,#2a0909) 0 0/100% 5px no-repeat,#0c0b0a;
  background-attachment:local}
.kb{position:relative;height:134px;min-width:720px;touch-action:pan-x}
.kb.play,.kb.play .wk,.kb.play .bk{touch-action:none}
.wk{position:absolute;top:0;bottom:0;border:none;border-radius:0 0 7px 7px;
  background:linear-gradient(180deg,#f3efe4 0%,#fbf8f0 52%,#efe9da 86%,#d8d0bd 96%,#bfb6a1 100%);
  box-shadow:inset -3px 0 5px -2px rgba(0,0,0,.30),inset 2px 0 0 rgba(255,255,255,.9),
             inset 0 -9px 10px -8px rgba(0,0,0,.45),0 3px 4px rgba(0,0,0,.45);
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;
  font-family:var(--f-label);font-size:10.5px;font-weight:600;color:#8f887a;touch-action:pan-x;overflow:hidden}
.wk::after{content:"";position:absolute;inset:0 0 auto 0;height:46%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0))}
.wk:active{background:linear-gradient(180deg,#fde9b4 0%,#fcd982 55%,#f0c45c 100%)}
.wk.cur{background:linear-gradient(180deg,#c6fbef 0%,#99f6e4 52%,#6ee0cb 88%,#4cc3ae 100%);color:#2b4f49}
.wk.on{background:linear-gradient(180deg,#fee08c 0%,#fbbf24 52%,#eda50c 88%,#c9860a 100%);color:#3a2703}
.wk.on.cur{background:linear-gradient(180deg,#e2ecb0 0%,#cada84 52%,#b3c665 88%,#93a648 100%);color:#2c3208;
  outline:2px solid #2dd4bf;outline-offset:-2px}
.wk.on.echo{outline:2px solid #93b84a;outline-offset:-2px}
.bk{position:absolute;top:0;height:calc((100% - 4px) * 0.5415 + 3.8px);z-index:10;border:none;border-radius:0 0 6px 6px;
  background:linear-gradient(180deg,#3b3b40 0%,#252529 22%,#18181b 58%,#101012 88%,#232327 100%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.16),inset -2px 0 3px -2px rgba(0,0,0,.65),0 4px 6px -3px rgba(0,0,0,.5);
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;
  font-family:var(--f-label);font-size:9.5px;font-weight:600;color:#a0a0a5;touch-action:pan-x;overflow:hidden}
.bk::after{content:"";position:absolute;left:9%;top:0;width:10%;height:60%;pointer-events:none;border-radius:0 0 60% 60%;
  background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.06) 55%,rgba(255,255,255,0))}
.bk:active{background:linear-gradient(180deg,#a9660f 0%,#7c440a 40%,#4a2705 85%,#2a1503 100%)}
.bk.cur{background:linear-gradient(180deg,#3ad6c2 0%,#14a394 30%,#0b6f66 78%,#053c37 100%);color:#e8fffb}
.bk.on{background:linear-gradient(180deg,#fcd77a 0%,#f59e0b 34%,#c17a06 82%,#7a4c03 100%);color:#2e1c02}
.bk.on.cur{background:linear-gradient(180deg,#b3c97e 0%,#819949 34%,#5c6e33 82%,#39441f 100%);color:#f2f7e6;
  outline:2px solid #5eead4;outline-offset:-2px}
.bk.on.echo{outline:2px solid #bcd98d;outline-offset:-2px}

/* 페이더 내비 */
.kbnav{display:flex;align-items:center;gap:6px;padding:6px 7px 7px;
  background:linear-gradient(180deg,#24211d,#1a1815);border-top:1px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.hbtn{flex:0 0 auto;min-width:38px;height:32px;padding:0 9px;border-radius:4px;border:1px solid #070605;
  display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#3a3631,#27241f);color:var(--legend);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 #080706}
.hbtn:active{transform:translateY(1px);box-shadow:inset 0 2px 3px rgba(0,0,0,.6),0 1px 0 #080706}
.hbtn.txt{font-family:var(--f-label);font-size:11px;font-weight:600;letter-spacing:.14em}
.kbtrack{flex:1 1 auto;position:relative;height:32px;touch-action:none;cursor:grab}
.kbtrack::before{content:"";position:absolute;left:4px;right:4px;top:50%;height:6px;margin-top:-3px;border-radius:3px;
  background:#050404;box-shadow:inset 0 1px 2px #000,0 1px 0 rgba(255,255,255,.07)}
.kbtrack::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:1px;
  background:repeating-linear-gradient(90deg,var(--legend-faint) 0 1px,transparent 1px 12.5%);opacity:.5;margin-top:9px}
.kbthumb{position:absolute;top:4px;bottom:4px;left:0;width:33%;border-radius:3px;pointer-events:none;
  background:linear-gradient(180deg,#c9c3b6 0%,#8e887d 48%,#5b564e 52%,#a39d91 100%);
  box-shadow:0 2px 3px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.5)}
.kbthumb::after{content:"";position:absolute;left:50%;top:3px;bottom:3px;width:2px;margin-left:-1px;background:#151311;
  box-shadow:-5px 0 0 rgba(0,0,0,.25),5px 0 0 rgba(0,0,0,.25)}
.kbtrack.drag .kbthumb::after{background:var(--amber);box-shadow:0 0 5px var(--amber)}

/* ── 모듈 랙 ── */
.grid3{display:grid;gap:10px}
@media(min-width:900px){.grid3{grid-template-columns:repeat(3,1fr)}}
.mhead{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 22px;
  border-bottom:1px solid #070605;box-shadow:0 1px 0 rgba(255,255,255,.05)}
.mhead .screw.a{left:8px;top:50%;margin-top:-3.5px;--r:60deg}
.mhead .screw.b{right:8px;top:50%;margin-top:-3.5px;--r:-15deg}
.mlabel{display:flex;align-items:baseline;gap:7px}
.mlabel .lg{font-size:12px;letter-spacing:.2em}
.mko{font-size:11px;color:var(--legend-dim)}
.count{font-family:var(--f-vfd);font-size:14px;color:#ff6b4a;min-width:30px;text-align:center;padding:1px 5px;border-radius:2px;
  background:#1c0705;box-shadow:inset 0 1px 2px #000,0 1px 0 rgba(255,255,255,.06);
  text-shadow:0 0 5px rgba(255,90,58,.75);font-variant-numeric:tabular-nums}
.mbody{padding:10px;display:flex;flex-direction:column;gap:8px}
.empty{font-size:12.5px;line-height:1.5;color:var(--legend-dim);margin:2px 2px}
.item{border-radius:4px;padding:10px 11px;background:var(--well);
  box-shadow:inset 0 1px 4px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.05)}
.irow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sym{font-family:var(--f-label);font-size:22px;font-weight:700;line-height:1.1;color:var(--legend);letter-spacing:.01em}
.ko{font-size:11.5px;color:var(--legend-dim);margin-left:7px}
.name{font-family:var(--f-label);font-size:16px;font-weight:600;color:var(--legend)}
.fam{font-size:10.5px;color:var(--legend-faint);margin-left:7px}
.deg{font-family:var(--f-vfd);font-size:11.5px;color:var(--legend-faint);margin-top:3px}
.miss{font-family:var(--f-label);font-size:11px;letter-spacing:.08em;color:#d08a3a}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.chip{min-width:24px;text-align:center;font-family:var(--f-label);font-size:12.5px;font-weight:600;padding:2px 6px 1px;border-radius:3px;
  color:#3a3329;background:linear-gradient(180deg,#ece5d3,#cfc6af);box-shadow:0 1px 0 #5b554b,inset 0 1px 0 rgba(255,255,255,.6)}
.chip.on{color:#3a2502;background:linear-gradient(180deg,#ffd789,#f3a632);box-shadow:0 1px 0 #6b4a14,0 0 8px rgba(255,179,71,.45)}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.pbtn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 6px;border-radius:4px;
  border:1px solid #070605;white-space:nowrap;font-size:12px;color:var(--legend);
  background:linear-gradient(180deg,#36322d,#26231f);box-shadow:inset 0 1px 0 rgba(255,255,255,.11),0 2px 0 #070605;
  transition:transform .06s}
.pbtn:active{transform:translateY(1px)}
.pbtn .led{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:#3d2a12;box-shadow:inset 0 0 1px #000}
.pbtn.on{transform:translateY(1px);background:linear-gradient(180deg,#2a2622,#211e1b);box-shadow:inset 0 2px 4px rgba(0,0,0,.65),0 1px 0 #070605}
.pbtn.on .led{background:var(--amber);box-shadow:0 0 6px var(--amber),0 0 12px rgba(255,179,71,.5)}
.cbtn{grid-column:1/-1;font-weight:600}
.cbtn .led{background:#0f3a32}
.cbtn.on .led{background:var(--vfd);box-shadow:0 0 6px var(--vfd),0 0 12px rgba(98,240,205,.5)}
.more{width:100%;min-height:36px;border-radius:4px;border:1px solid #070605;font-family:var(--f-label);font-size:12px;font-weight:600;
  letter-spacing:.06em;color:var(--legend-dim);background:linear-gradient(180deg,#2c2925,#211e1b);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 0 #070605}
.more:active{transform:translateY(1px)}

/* ── 레퍼런스 카드 (종이) ── */
.paper{position:relative;margin-top:14px;padding:14px 14px 12px;border-radius:2px;color:var(--ink);
  background:
    radial-gradient(rgba(120,90,40,.08) 1px,transparent 1.4px) 0 0/5px 5px,
    linear-gradient(180deg,#f0e7d0 0%,#e6dabd 100%);
  box-shadow:0 3px 10px rgba(0,0,0,.65)}
.paper::before,.paper::after{content:"";position:absolute;top:-7px;width:58px;height:16px;
  background:rgba(232,220,186,.82);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.paper::before{left:16px;transform:rotate(-4deg)}
.paper::after{right:16px;transform:rotate(3deg)}
.ptitle{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:5px;margin-bottom:6px}
.ptitle b{font-family:var(--f-label);font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.ptitle span{font-size:11px;color:var(--ink-dim)}
.paper .scroll{margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;min-width:520px;text-align:left}
th{font-family:var(--f-label);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);
  padding:6px 8px;border-bottom:1px solid rgba(44,37,27,.5)}
td{padding:8px;border-bottom:1px dotted rgba(44,37,27,.4);font-size:12.5px;color:#4a4032}
td.first{color:var(--ink);font-weight:700}
td.res{font-family:var(--f-label);font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap}
td.res span{margin-right:6px}
td.res .alt{color:var(--ink-red);font-weight:700}
.tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tips li{position:relative;padding-left:14px;font-size:12px;line-height:1.5;color:#4a4032}
.tips li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--ink-red)}
.sign{margin-top:10px;text-align:right;font-family:var(--f-script);font-size:17px;color:#5a4a36}

/* ── 하단 컨트롤 스트립 ── */
.console{flex:0 0 auto;display:flex;padding:4px}
.ctl{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:5px;padding:4px 5px;border-radius:4px;text-align:left}
.ctl+.ctl{border-left:1px solid #070605;box-shadow:inset 1px 0 0 rgba(255,255,255,.045);border-radius:0}
.ctl:active{background:rgba(255,255,255,.035)}
.ctx{min-width:0;display:flex;flex-direction:column;gap:2px}
.ctx .lg{font-size:10.5px;letter-spacing:.08em;display:flex;align-items:center;gap:4px}
.st{font-size:10.5px;color:var(--legend-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 토글 스위치 */
.tog{position:relative;flex:0 0 auto;width:20px;height:32px}
.tplate{position:absolute;inset:3px 1px;border-radius:3px;background:linear-gradient(180deg,#3d3934,#221f1b);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 0 #000,0 0 0 1px #070605}
.lever{position:absolute;left:50%;bottom:50%;width:6px;height:15px;margin-left:-3px;transform-origin:50% 100%;
  border-radius:3px 3px 2px 2px;background:linear-gradient(90deg,#77716a,#f4f0e8 45%,#9d978c 100%);
  box-shadow:0 0 1px #000;transition:transform .13s ease-out}
.lever::before{content:"";position:absolute;left:-1px;top:-3px;width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fffdf8,#bdb6aa 55%,#6f695f)}
.tog.dn .lever{transform:scaleY(-1)}
.nut{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#dcd7cd,#7d776d 58%,#3a3631);box-shadow:0 1px 2px #000}
.pl{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:#3a1009;box-shadow:inset 0 0 1px #000}
.pl.on{background:radial-gradient(circle at 40% 35%,#ffd2bf,#ff4a2a 50%,#a3170a);box-shadow:0 0 6px rgba(255,74,42,.85)}
.pl.amb.on{background:radial-gradient(circle at 40% 35%,#fff0c8,#ffb347 50%,#b46d0d);box-shadow:0 0 6px rgba(255,179,71,.85)}
/* 점등식 사각 푸시버튼 (사운드) */
.litbtn{flex:0 0 auto;width:30px;height:30px;padding:3px;border-radius:5px;
  background:linear-gradient(180deg,#0a0a0a,#262423);
  box-shadow:inset 0 1px 2px #000,0 0 0 1px #050404,0 1px 0 rgba(255,255,255,.08)}
.lens{display:block;width:100%;height:100%;border-radius:3px;transition:background .1s,box-shadow .1s,transform .06s;
  background:radial-gradient(circle at 50% 40%,#5c1e18 0%,#3e130f 65%,#2b0c09 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.07)}
.litbtn.on .lens{background:radial-gradient(circle at 50% 38%,#ffc2b8 0%,#f47a6e 30%,#e5554a 68%,#cc3d33 100%);
  box-shadow:inset 0 0 0 1px rgba(110,20,12,.55),inset 0 -2px 3px rgba(110,20,12,.3),0 0 8px rgba(244,106,94,.55),0 0 18px rgba(244,106,94,.22)}
.ctl:active .lens{transform:scale(.94)}
/* 순간 버튼 */
.cap{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 2px #0a0908,0 0 0 3px #3a352f,0 2px 3px rgba(0,0,0,.7);transition:transform .06s}
.cap.dark{background:radial-gradient(circle at 40% 30%,#4c4740,#24211d 70%);color:var(--legend)}
.cap.red{background:radial-gradient(circle at 40% 30%,#ff8a72,#d23a24 55%,#8a1a0d)}
.ctl:active .cap{transform:translateY(1px) scale(.96);filter:brightness(.85)}

/* 짧은 화면 */
@media(max-height:700px){
  .model,.tnote{display:none}
  .script{font-size:23px}
  .vu{width:96px}
  .tbtn{min-height:38px;padding-top:7px}
  .tbtn i{display:none}
  .glass{min-height:52px;padding:5px 11px}
  .vhead{font-size:26px}
  .vnotes{font-size:15px}
  .kb{height:104px}
  .hbtn,.kbtrack{height:28px}
  .tog{height:30px}
  .ctl{padding:3px 6px}
}
@media(min-height:940px){
  .script{font-size:31px}
  .vu{width:124px}
  .kb{height:160px}
  .glass{min-height:74px}
  .vhead{font-size:38px}
}
@media(max-width:380px){
  .ctl{gap:5px;padding:4px 5px}
  .ctx .lg{font-size:10px;letter-spacing:.06em}
  .st{font-size:10px}
  .vu{width:92px}
}
@media (hover:hover){
  .tbtn:hover b,.hbtn:hover,.pbtn:hover,.more:hover{color:#fff4dc}
  .sg:hover{background:#2f2b26}
  .wk:hover{filter:brightness(1.04)}
  .bk:hover{filter:brightness(1.18)}
}
@media (prefers-reduced-motion: reduce){
  .lever,.tbtn,.pbtn,.cap{transition:none}
  #splash img{animation:none}
}


/* ═══════════ 실사 레이어 — 질감은 시작 시 캔버스로 생성(--tx-*), 없으면 단색으로 동작 ═══════════ */
:root{
  --ivory:linear-gradient(180deg,#cfc8b8 0%,#ece6d8 6%,#f8f4ea 40%,#f2ecdf 84%,#e3dccb 92%,#c2b9a5 93.2%,#efe9dc 94.4%,#d9d1bf 100%);
}
html,body{background-color:#151413}
body{background-image:var(--tx-leather,none);background-size:160px 160px}
.hwrap::before{background:linear-gradient(to right,#151413 10%,rgba(21,20,19,0))}
.hwrap::after{background:linear-gradient(to left,#151413 10%,rgba(21,20,19,0))}

/* 브러시드 아노다이징 패널 */
.unit{
  background-image:var(--tx-grain,none),var(--tx-brushed,none),
    linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 35%,rgba(0,0,0,.2)),
    linear-gradient(180deg,#2f2d2a,#252320);
  background-size:128px 128px,512px 96px,100% 100%,100% 100%;
  border:1px solid #040303;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 1px 0 0 rgba(255,255,255,.05),inset -1px 0 0 rgba(0,0,0,.45),
             inset 0 -1px 0 rgba(0,0,0,.65),0 1px 0 #000,0 2px 3px rgba(0,0,0,.55),0 8px 16px rgba(0,0,0,.5)}
/* 십자 나사 */
.screw{width:9px;height:9px;
  background:radial-gradient(circle at 34% 28%,#f2efe8 0%,#b3afa6 22%,#6a665e 62%,#2f2c28 100%);
  box-shadow:0 0 0 1px rgba(0,0,0,.9),0 1px 1px rgba(255,255,255,.14),inset 0 -1px 1px rgba(0,0,0,.55)}
.screw::before,.screw::after{content:"";position:absolute;left:50%;top:50%;right:auto;width:6px;height:1.5px;margin:-.75px 0 0 -3px;
  border-radius:1px;background:linear-gradient(180deg,#141210,#3f3b36);box-shadow:0 .5px 0 rgba(255,255,255,.25)}
.screw::after{transform:rotate(var(--r,38deg))}
.screw::before{transform:rotate(calc(var(--r,38deg) + 90deg))}
.mhead .screw.a,.mhead .screw.b{margin-top:-4.5px}

/* 실크 인쇄 로고 */
.script{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#e6dcc4;filter:none;
  text-shadow:0 -1px 0 rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.06)}

/* VU 베젤: 광택 베이클라이트 */
.vu{padding:4px;border-radius:6px;background:linear-gradient(180deg,#040404,#22201e 48%,#0b0a0a);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.2),inset 0 -1px 2px rgba(0,0,0,.9),0 0 0 1px #000,0 3px 7px rgba(0,0,0,.65)}
.vu.peak #peak{fill:#ff5a3a;filter:drop-shadow(0 0 2px #ff5a3a)}

/* 이조 버튼: 사출 플라스틱 캡 + 라이트 파이프 */
.tbtn{border:none;
  background-image:var(--tx-grain,none),linear-gradient(180deg,#4b4743 0%,#38352f 9%,#2b2825 62%,#1f1d1a 100%);
  background-size:128px 128px,100% 100%;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -2px 2px rgba(0,0,0,.45),0 0 0 1px #050404,0 3px 0 #0b0a09,0 4px 6px rgba(0,0,0,.6)}
.tbtn.on{transform:translateY(2px);
  background-image:var(--tx-grain,none),linear-gradient(180deg,#2c2926,#22201d);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.8),inset 0 0 0 1px rgba(0,0,0,.5),0 0 0 1px #050404,0 1px 0 #0b0a09}
.tbtn .tl{height:4px;background:linear-gradient(180deg,#24190b,#3b2912);box-shadow:inset 0 1px 1px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.08)}
.tbtn.on .tl{background:radial-gradient(ellipse at 50% 40%,#fff6d8 0%,#ffc66a 35%,#f59b1d 75%,#b8660a 100%);
  box-shadow:0 0 4px #ffb347,0 0 12px rgba(255,170,60,.6),0 0 24px rgba(255,170,60,.22),inset 0 0 1px rgba(120,60,0,.8)}

/* 마스킹 테이프 라벨 */
.hc{background-image:var(--tx-grain,none),linear-gradient(180deg,rgba(238,227,196,.94),rgba(214,200,165,.94));background-size:128px 128px,100% 100%}

/* 입력 슬롯 */
.sb{background-image:var(--tx-grain,none),linear-gradient(180deg,#070606,#0f0e0d);background-size:128px 128px,100% 100%}
.sugg{background-image:var(--tx-grain,none),var(--tx-brushed,none),linear-gradient(180deg,#2a2724,#1d1b18);background-size:128px 128px,512px 96px,100% 100%}

/* VFD: 금속 메시 + 유리 반사 */
.display{background:linear-gradient(180deg,#020202,#1e1d1c 55%,#0a0a0a);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.14),0 0 0 1px #000,0 3px 7px rgba(0,0,0,.6)}
.glass{background:radial-gradient(130% 160% at 50% 0%,#0b1a16 0%,#050c0a 55%,#030605 100%)}
.glass::before{background:
  repeating-linear-gradient(0deg,rgba(0,0,0,.38) 0 1px,transparent 1px 2.6px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.26) 0 1px,transparent 1px 2.6px)}
.glass::after{background:
  linear-gradient(163deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.035) 34%,rgba(255,255,255,0) 35%),
  radial-gradient(120% 60% at 50% -10%,rgba(255,255,255,.07),transparent 60%)}
.vnotes,.vhead{text-shadow:0 0 1px #d6fff4,0 0 4px rgba(98,240,205,.9),0 0 12px rgba(98,240,205,.45),0 0 26px rgba(98,240,205,.18)}

/* 건반: 월넛 치크 + 레드 펠트 + 상아 · 흑단 */
.cheek{flex:0 0 14px;background-image:
  linear-gradient(90deg,rgba(0,0,0,.6),rgba(255,236,210,.13) 30%,rgba(255,236,210,.05) 55%,rgba(0,0,0,.55)),
  var(--tx-wood,linear-gradient(#5a341c,#3a2012));background-size:100% 100%,64px 512px}
.kbbed{background:#070707}
#kbscroll{padding-top:7px;background:
  linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55)) 0 0/100% 7px no-repeat,
  var(--tx-grain,none) 0 0/128px 7px repeat-x,
  linear-gradient(180deg,#6b1a17,#4a0f0d) 0 0/100% 7px no-repeat,#070707;background-attachment:local}
.wk{border-radius:0 0 4px 4px;color:#9a937f;
  background-image:var(--tx-grain,none),var(--ivory);background-size:128px 128px,100% 100%;
  box-shadow:inset 0 8px 8px -6px rgba(0,0,0,.55),inset -1px 0 0 rgba(0,0,0,.32),inset 1px 0 0 rgba(255,255,255,.95),
             inset -4px 0 5px -4px rgba(0,0,0,.25),0 2px 2px rgba(0,0,0,.55);
  transition:transform .05s}
.wk::after{height:40%;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0))}
.wk:active{background-image:var(--tx-grain,none),linear-gradient(rgba(255,196,96,.32),rgba(255,196,96,.32)),var(--ivory);transform:translateY(1px)}
.wk.on{background-image:var(--tx-grain,none),linear-gradient(180deg,rgba(255,180,52,.80),rgba(242,150,16,.86)),var(--ivory);
  color:#4a3005;transform:translateY(1.5px);
  box-shadow:inset 0 10px 9px -6px rgba(90,40,0,.55),inset -1px 0 0 rgba(0,0,0,.3),inset 1px 0 0 rgba(255,240,200,.7),0 1px 1px rgba(0,0,0,.5)}
.wk.cur{background-image:var(--tx-grain,none),linear-gradient(180deg,rgba(78,232,200,.72),rgba(40,196,168,.78)),var(--ivory);color:#1f4a42}
.wk.on.cur{background-image:var(--tx-grain,none),linear-gradient(180deg,rgba(186,212,96,.82),rgba(150,180,64,.86)),var(--ivory);color:#2c3208}

/* ═══ 최상단 패널: 가로 한 줄 (높이 최소화) ═══ */
.head{gap:8px;padding:5px 10px 5px 18px;align-items:center}
.head .screw.a{top:6px}.head .screw.b{bottom:6px}
.brand{flex:0 1 auto;min-width:0}
.script{font-size:17px;line-height:.98;white-space:normal}
.script span{display:block}
.model,.kname{display:none}
.minis{flex:0 0 auto;display:flex;align-items:flex-end;gap:2px;margin:0}
.mini{min-width:30px;min-height:36px;gap:3px}

.hline{width:7px}

  .head{gap:12px;padding-left:22px}

  .minis{gap:6px}
  .hctl{--kw:58px;gap:6px}

}

.wrap,#top{gap:5px}

/* 디스플레이 */

/* 재생 버튼: 항상 한 줄 */
.pbtns{display:flex;gap:4px;margin-top:6px}
.pbtn{flex:1 1 0;min-width:0;min-height:30px;padding:0 3px;gap:4px;font-size:11px;overflow:hidden;text-overflow:clip}

/* ═══ 전체 스크롤 모드(가로 · 낮은 화면) + 오버레이 스크롤바 ═══ */
body.flow .wrap{display:block;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
body.flow .wrap::-webkit-scrollbar{display:none}
body.flow #top{margin-bottom:5px}
body.flow #results{overflow:visible;height:auto;min-height:0;flex:none}
.oscroll{position:fixed;right:max(1px,env(safe-area-inset-right,0px));width:12px;z-index:50;touch-action:none;cursor:pointer}
.oscroll::before{content:"";position:absolute;right:3px;top:0;bottom:0;width:3px;border-radius:2px;background:rgba(234,223,196,.09)}
.othumb{position:absolute;right:2px;top:0;width:5px;border-radius:3px;background:rgba(234,223,196,.45);
  box-shadow:0 0 0 1px rgba(0,0,0,.4);transition:width .12s,right .12s,background .2s}
.oscroll.act .othumb{background:rgba(234,223,196,.75)}
.oscroll.drag .othumb{width:7px;right:1px;background:var(--amber)}


/* 건반 높이 (+10% 두 차례) */

@media(min-height:900px){ .kb{height:165px} }

/* 가까운 후보: 세로 여백 축소 */

.item.near .miss{font-size:10.5px}
.item.near .chips{margin-top:3px;gap:3px}

.item.near .pbtns{margin-top:4px}
.item.near .pbtn{min-height:27px}
.item.near .irow{flex-wrap:nowrap}
.item.near .name{flex:0 0 auto}
.item.near .chips{margin-top:0;flex:0 1 auto;min-width:0;flex-wrap:nowrap;overflow:hidden}

/* 모듈 제목 한 단계 확대 — 헤더 높이 28px 고정 유지 */

.mko{font-size:12.5px;line-height:1}

.hctl .knob{margin-right:calc(var(--kw) * -0.2343)}

@media(min-width:760px){ .hctl .vu{margin-left:12px} }

.dr .vtune{max-width:calc(100vw - 168px)}
@media(min-width:600px){ .dr .vtune{max-width:none} }

/* 이조 안내는 대문자 변환 없이 (Bb가 BB로 보이지 않게) */
.vtune{text-transform:none}

/* 부제 자간 축소 */
.sub2{letter-spacing:.02em}
@media(min-width:421px){ .sub2{letter-spacing:.08em} }

/* 로고 장평 확대 (가로 1.14배) — 늘어난 폭만큼 JS가 오른쪽 여백을 확보 */
.brand{flex-shrink:0}
.brand .script{display:inline-block;transform:scaleX(1.14);transform-origin:0 50%}

/* 글로우 누른 음 한 단계 확대 */
.vnotes{font-size:22px}
@media(max-height:700px){ .vnotes{font-size:20px} }
@media(min-height:900px){ .vnotes{font-size:24px} }

/* 421~599px: 로고·부제는 두 줄 유지 (한 줄이면 가로 넘침) */
@media(min-width:421px) and (max-width:599px){
  .brand .script{font-size:20px;line-height:.9}
  .script span,.sub2 span{display:block}
  .sub2{font-size:7.5px;letter-spacing:.02em}
}

/* 부제는 항상 한 줄 */
.sub2,.brand .sub2{white-space:nowrap}
.sub2 span,.brand .sub2 span{display:inline!important}
.sub2{margin-top:3px}

/* 부제 한 줄 확보를 위한 좁은 폭 미세 조정 */
@media(max-width:374px){
  .head{gap:6px;padding-left:16px;padding-right:8px}
  .mini{min-width:28px}
  .hctl .vu{width:70px;margin-left:5px}
  .sub2{font-size:6.6px}
}
@media(min-width:421px) and (max-width:599px){
  .minis{gap:2px}
  .mini{min-width:32px}
  .hctl{--kw:51px;gap:4px}
  .hline{width:6px}
  .hctl .vu{width:84px;margin-left:8px}
}

/* 시작 스플래시 (원본 유지) */
#splash{position:fixed;inset:0;z-index:999;background:#0A0A0B;display:flex;align-items:center;justify-content:center;transition:opacity .28s ease}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:44vmin;max-width:220px;min-width:128px;border-radius:22%;display:block;animation:splashIn .5s ease-out both}
@keyframes splashIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
</style>
</head>

function eq(a,b){ if(a.length!==b.length) return false; for(var i=0;i<a.length;i++) if(a[i]!==b[i]) return false; return true; }
function findChords(pcs,bass){
  var exact=[],root,ivs,i;
  for(root=0;root<12;root++){
    if(pcs.indexOf(root)<0) continue;
    ivs=pcs.map(function(p){return mod(p-root);}).sort(function(a,b){return a-b;});
    for(i=0;i<CHORDS.length;i++) if(eq(ivs,CHORDS[i].ivs)) exact.push({root:root,c:CHORDS[i]});
  }
  exact.sort(function(a,b){return (b.root===bass)-(a.root===bass);});
  if(exact.length) return {exact:exact,near:[]};
  var near=[];
  for(root=0;root<12;root++){
    CHORDS.forEach(function(c){
      var r=root, set=c.ivs.map(function(iv){return mod(iv+r);});
      if(c.ivs.length>pcs.length && c.ivs.length-pcs.length<=2 &&
         pcs.every(function(p){return set.indexOf(p)>=0;}))
        near.push({root:r,c:c,missing:c.ivs.length-pcs.length});
    });
  }
  near.sort(function(a,b){return a.missing-b.missing || (b.root===bass)-(a.root===bass);});
  return {exact:[],near:near.slice(0,8)};
}
function matchScales(list,pcs,bass){
  var out=[];
  for(var root=0;root<12;root++){
    list.forEach(function(s){
      var r=root, notes=s.ivs.map(function(iv){return mod(iv+r);});
      if(pcs.every(function(p){return notes.indexOf(p)>=0;})) out.push({root:r,s:s,notes:notes});
    });
  }
  out.sort(function(a,b){ return (b.root===bass)-(a.root===bass) || a.notes.length-b.notes.length || a.root-b.root; });
  return out;
}

function ensureAudio(){
  try{

      master.connect(comp); comp.connect(volNode); volNode.connect(analyser); analyser.connect(ctx.destination);
    }
    if(ctx.state!=="running"){
      ctx.resume();
      try{
        var b=ctx.createBufferSource();

        b.connect(ctx.destination); b.start(0);

  ensureAudio();

function voice(midi,dur,vol){
  try{
    if(!ctx||!master) return;
    var t=ctx.currentTime, f=440*Math.pow(2,(midi-69)/12);
    var atk=Math.min(0.018,dur*0.05), rel=Math.min(0.55,dur*0.35);
    var amp=ctx.createGain();
    amp.gain.setValueAtTime(0.0001,t);
    amp.gain.exponentialRampToValueAtTime(vol,t+atk);
    amp.gain.exponentialRampToValueAtTime(vol*0.82,t+Math.min(0.22,dur*0.18));
    amp.gain.exponentialRampToValueAtTime(vol*0.62,t+dur-rel);
    amp.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    var lp=ctx.createBiquadFilter();
    lp.type="lowpass"; lp.Q.value=0.9;
    lp.frequency.setValueAtTime(Math.min(18000,f*22),t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(1600,Math.min(16000,f*11)),t+Math.min(1.2,dur*0.8));
    amp.connect(lp); lp.connect(master);
    PARTIALS.forEach(function(v){
      var o=ctx.createOscillator(), og=ctx.createGain();
      o.type=v[0]; o.frequency.value=f*v[1];
      og.gain.setValueAtTime(v[2],t);
      og.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(0.15,dur*v[3]));
      o.connect(og); og.connect(amp);
      o.start(t); o.stop(t+dur+0.05);
    });
  }catch(e){}
}

      for(x=0;x<w;x++){ tmp[y*w+x]=s/n; s+=a[y*w+(x+rx+1)%w]-a[y*w+(((x-rx)%w)+w)%w]; } }
    a.set(tmp); }

    for(x=0;x<w;x++){ s=0; for(k=-ry;k<=ry;k++) s+=a[(((k%h)+h)%h)*w+x];

function vuTick(t){

  var target=-0.04, db=-60, a=0;
  if(analyser && S.sound && ctx && ctx.state==="running"){
    var flt=!!analyser.getFloatTimeDomainData, sum=0, i, v;
    if(!vuBuf) vuBuf=flt?new Float32Array(analyser.fftSize):new Uint8Array(analyser.fftSize);
    if(flt){ analyser.getFloatTimeDomainData(vuBuf); for(i=0;i<vuBuf.length;i++){ v=vuBuf[i]; sum+=v*v; } }
    else { analyser.getByteTimeDomainData(vuBuf); for(i=0;i<vuBuf.length;i++){ v=(vuBuf[i]-128)/128; sum+=v*v; } }

  vuVel+=(170*(target-vuPos)-20*vuVel)*dt;

  var was=S.playingId===id;
  stopSeq();
  if(was||!S.sel.length){ renderPlayState(); return; }
  var midis=S.sel.slice().sort(function(a,b){return a-b;});
  if(desc) midis.reverse();
  runSeq(midis,id);
}
function runSeq(midis,id){
  S.playingId=id;
  midis.forEach(function(m,i){
    timers.push(setTimeout(function(){ play(m,BEAT/1000*2.25); S.curMidis=[m]; renderPlayState(); }, i*BEAT));
  });
  timers.push(setTimeout(function(){ stopSeq(); renderPlayState(); }, midis.length*BEAT));
  renderPlayState();

function chordMidis(root,ivs){
  var want=ivs.map(function(iv){return mod(root+iv);});
  var out=[];
  S.sel.forEach(function(m){ if(want.indexOf(mod(m))>=0) out.push(m); });
  var base=out.length?Math.min.apply(null,out):60+root;
  want.forEach(function(pc){
    var has=false;
    out.forEach(function(m){ if(mod(m)===pc) has=true; });
    if(has) return;
    var m=base+mod(pc-mod(base));
    while(m>83) m-=12;
    while(m<48) m+=12;
    out.push(m);
  });
  out.sort(function(a,b){return a-b;});
  return out;

function chordPlay(root,ivs,id){

  var vol=Math.max(0.14, 0.52/Math.sqrt(midis.length));
  var dur=3.33;

  S.curMidis=midis.slice();

function pad2(n){ return (n<10?"0":"")+n; }
function analyze(){
  var pcs=[]; S.sel.forEach(function(m){ if(pcs.indexOf(mod(m))<0) pcs.push(mod(m)); });
  pcs.sort(function(a,b){return a-b;});
  var bass=S.sel.length?mod(Math.min.apply(null,S.sel)):null;
  var flat=bass!==null&&isFlat(bass);
  var chords=pcs.length>=2?findChords(pcs,bass):{exact:[],near:[]};
  var headline=null;
  if(chords.exact.length){
    var e=chords.exact[0], f=isFlat(e.root);
    headline=nm(e.root,f)+e.c.sym+(bass!==e.root?"/"+nm(bass,f):"");
  } else if(pcs.length===1) headline=nm(pcs[0],flat);
  else if(pcs.length>1) headline="?";
  return {pcs:pcs,bass:bass,flat:flat,chords:chords,headline:headline,
          scales:pcs.length?matchScales(SCALES,pcs,bass):[],
          modes:pcs.length?matchScales(MODES,pcs,bass):[]};
}

      +'<span class="tl"></span><b>'+t.label+'</b></button>';

}

function chipsHTML(notes,picked){
  return '<div class="chips">'+notes.map(function(n){
    return '<span class="chip'+(picked.indexOf(n)>=0?' on':'')+'">'+nm(n,isFlat(notes[0]))+'</span>';
  }).join('')+'</div>';
}
function playBtns(root,ivs,id,addOct,pcs,withChord){
  var selIvs=ivs.filter(function(iv){return pcs.indexOf(mod(root+iv))>=0;});
  var partial=selIvs.length>0 && selIvs.length<ivs.length;
  var total=ivs.length+(addOct?1:0);
  function b(bid,list,oct,desc,text,full){
    return '<button type="button" class="pbtn'+(S.playingId===bid?' on':'')+'" data-act="play" data-root="'+root+
      '" data-ivs="'+list.join(',')+'" data-id="'+bid+'" data-oct="'+(oct?1:0)+'" data-desc="'+(desc?1:0)+'" aria-label="'+full+'" title="'+full+'">'
      +'<span class="led"></span>'+text+'</button>';
  }
  var h='<div class="pbtns">';
  if(withChord){
    var cid=id+'-chord', cf='동시 듣기 · '+ivs.length+'음 화음';
    h+='<button type="button" class="pbtn cbtn'+(S.playingId===cid?' on':'')+'" data-act="chord" data-root="'+root+
       '" data-ivs="'+ivs.join(',')+'" data-id="'+cid+'" aria-label="'+cf+'" title="'+cf+'"><span class="led"></span>♫ 화음</button>';
  }
  h+=b(id+'-all-up',ivs,addOct,false,'▲ 상행','전체 '+total+'음 상행');
  h+=b(id+'-all-dn',ivs,addOct,true ,'▼ 하행','전체 '+total+'음 하행');
  if(partial){
    var n=S.sel.length;
    h+='<button type="button" class="pbtn'+(S.playingId===id+'-sel-up'?' on':'')+'" data-act="selplay" data-id="'+id+'-sel-up" data-desc="0" aria-label="누른 음 '+n+'개 상행" title="누른 음 '+n+'개 상행"><span class="led"></span>▲ 누른음 '+n+'</button>';
    h+='<button type="button" class="pbtn'+(S.playingId===id+'-sel-dn'?' on':'')+'" data-act="selplay" data-id="'+id+'-sel-dn" data-desc="1" aria-label="누른 음 '+n+'개 하행" title="누른 음 '+n+'개 하행"><span class="led"></span>▼ 누른음 '+n+'</button>';
  }
  return h+'</div>';
}
function modHead(en,ko,count){
  return '<div class="mhead"><span class="screw a"></span><span class="screw b"></span>'
    +'<span class="mlabel"><span class="lg">'+en+'</span><span class="mko">'+ko+'</span></span>'
    +'<span class="count">'+(count===null?'--':pad2(count))+'</span></div>';
}

function flashKey(el){
  if(!el) return;
  el.classList.add("cur");
  setTimeout(function(){ el.classList.remove("cur"); },200);
}
function holdKey(el,pid){ if(!el) return; el.classList.add("cur"); heldKeys[pid]=el; }
function releaseKey(pid){
  var el=heldKeys[pid]; if(!el) return;
  delete heldKeys[pid];
  if(!isHeld(el) && S.curMidis.indexOf(+el.getAttribute('data-midi'))<0) el.classList.remove("cur");
}
function releaseAllKeys(){ for(var k in heldKeys) releaseKey(k); }
["pointerup","pointercancel"].forEach(function(t){ document.addEventListener(t,function(ev){ releaseKey(ev.pointerId); },{passive:true}); });
window.addEventListener("blur",releaseAllKeys);

function toggleKey(midi,el,pid){
  if(S.playMode){
    play(midi,2.2);
    if(pid===undefined) flashKey(el); else holdKey(el,pid);
    return;
  }
  var i=S.sel.indexOf(midi);
  if(i>=0) S.sel.splice(i,1);
  else { S.sel.push(midi); S.sel.sort(function(x,y){return x-y;}); play(midi); }
  S.moreScale=false; S.moreMode=false;
  clearQuery();
  render();
}

var glissLast={};
document.addEventListener('pointerdown',function(ev){
  ensureAudio(); keepAwake();
  var el=ev.target.closest?ev.target.closest('[data-act="key"]'):null;
  if(!el) return;
  lastKeyPointer=Date.now();
  var midi=+el.getAttribute('data-midi');
  if(S.playMode) glissLast[ev.pointerId]=midi;
  toggleKey(midi,el,ev.pointerId);
},{passive:true});
document.addEventListener('pointermove',function(ev){
  if(!S.playMode||!(ev.pointerId in glissLast)) return;
  var t=document.elementFromPoint(ev.clientX,ev.clientY);
  var k=(t&&t.closest)?t.closest('[data-act="key"]'):null;
  if(!k) return;
  var m=+k.getAttribute('data-midi');
  if(m===glissLast[ev.pointerId]) return;
  glissLast[ev.pointerId]=m;
  releaseKey(ev.pointerId);
  play(m,1.4);
  holdKey(k,ev.pointerId);
},{passive:true});
['pointerup','pointercancel'].forEach(function(t){
  document.addEventListener(t,function(ev){ delete glissLast[ev.pointerId]; },{passive:true});
});

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');
  if(!el) return;
  var a=el.getAttribute('data-act');
  if(a==='key'){
    if(Date.now()-lastKeyPointer<800) return;
    toggleKey(+el.getAttribute('data-midi'),el);
  }
  else if(a==='tune'){ buzz(); S.tune=el.getAttribute('data-tune'); stopSeq(); render(); }
  else if(a==='sound'){ buzz(); S.sound=!S.sound; if(!S.sound) stopSeq(); render(); }
  else if(a==='fs'){ buzz(); toggleFs(); }
  else if(a==='play-mode'){
    buzz(12);
    releaseAllKeys();
    if(!S.playMode){ snapshotSel(); stopSeq(); S.sel=[]; clearQuery(); }
    S.playMode=!S.playMode; resetRes=true; render();
  }
  else if(a==='center'){ centerKeyboard(); }
  else if(a==='oct'){
    var kbe=$('kbscroll');
    if(kbe){
      var step=kbe.scrollWidth/3, dir=+el.getAttribute('data-dir');
      var max=kbe.scrollWidth-kbe.clientWidth;
      var to=Math.max(0,Math.min(max,kbe.scrollLeft+dir*step));
      if(kbe.scrollTo) kbe.scrollTo({left:to,behavior:'smooth'}); else kbe.scrollLeft=to;
      setTimeout(updateThumb,320);
    }
  }
  else if(a==='restart'){
    buzz(14);
    snapshotSel(); stopSeq(); S.sel=[]; S.moreScale=false; S.moreMode=false; resetRes=true;
    clearQuery(); render(); centerKeyboard();
  }
  else if(a==='more-scale'){ S.moreScale=!S.moreScale; render(); }
  else if(a==='more-mode'){ S.moreMode=!S.moreMode; render(); }
  else if(a==='chord'){
    chordPlay(+el.getAttribute('data-root'), el.getAttribute('data-ivs').split(',').map(Number), el.getAttribute('data-id'));
  }
  else if(a==='selplay'){ selPlay(el.getAttribute('data-id'), el.getAttribute('data-desc')==='1'); }
  else if(a==='play'){
    seqPlay(+el.getAttribute('data-root'), el.getAttribute('data-ivs').split(',').map(Number),
            el.getAttribute('data-id'), el.getAttribute('data-oct')==='1', el.getAttribute('data-desc')==='1');
  }
});

var KO_SHARP=["도","도#","레","레#","미","파","파#","솔","솔#","라","라#","시"];
var KO_FLAT =["도","레b","레","미b","미","파","솔b","솔","라b","라","시b","시"];
function norm(x){
  return String(x||"").toLowerCase().replace(/[♯]/g,"#").replace(/[♭]/g,"b").replace(/[\s._\/()]/g,"");
}
var ROOTNAMES=(function(){
  var out=[],seen={};
  for(var pc=0;pc<12;pc++){
    [SHARP[pc],FLAT[pc],KO_SHARP[pc],KO_FLAT[pc]].forEach(function(n){
      var k=pc+"|"+norm(n);
      if(!n||seen[k])return; seen[k]=1;
      out.push({pc:pc,name:n,n:norm(n)});
    });
  }
  out.sort(function(a,b){return b.n.length-a.n.length;});
  return out;
})();
var CATALOG=(function(){
  var out=[];
  CHORDS.forEach(function(c,i){ out.push({kind:"chord",order:i,ivs:c.ivs,label:c.sym,sub:c.ko,alts:[c.sym,c.ko].concat(c.alt||[]).map(norm)}); });
  SCALES.forEach(function(x,i){ out.push({kind:"scale",order:i,ivs:x.ivs,label:x.ko,sub:x.en,alts:[x.ko,x.en].concat(x.alt||[]).map(norm)}); });
  MODES.forEach(function(x,i){ out.push({kind:"mode",order:i,ivs:x.ivs,label:x.ko,sub:x.en+" · "+x.fam+" 계열",alts:[x.ko,x.en].concat(x.alt||[]).map(norm)}); });
  return out;
})();
var KIND_ORDER={chord:0,scale:1,mode:2};
var KIND_KO={chord:"코드",scale:"스케일",mode:"모드"};
function matchAlt(it,rest){
  var best=-1,i,a;
  for(i=0;i<it.alts.length;i++){
    a=it.alts[i];
    if(rest===a) return 0;
    if(!rest){ if(best<0) best=1; continue; }
    if(a && a.indexOf(rest)===0){ best=1; }
    else if(a && rest.length>=2 && a.indexOf(rest)>0 && best<0){ best=2; }
  }
  return best;
}
function searchQ(raw){
  var q=norm(raw);
  if(!q) return [];
  var out=run(q);
  if(!out.length && q.indexOf("-")>=0) out=run(q.replace(/-/g,""));
  return out.slice(0,16);
  function run(q){
    var res=[], seen={};
    function add(pc,it,sc,rlen,flat){
      var key=pc+"|"+it.kind+"|"+it.order, prev=seen[key];
      if(prev){ if(sc<prev.score){ prev.score=sc; prev.rlen=rlen; prev.flat=flat; } return; }
      var o={pc:pc,it:it,score:sc,rlen:rlen,flat:flat};
      seen[key]=o; res.push(o);
    }
    ROOTNAMES.forEach(function(r){
      if(q.indexOf(r.n)!==0) return;
      var rest=q.slice(r.n.length);
      var flat=(r.name.indexOf("#")>0||r.name.indexOf("#")>0)?false:
               (r.name.indexOf("b")>0||r.name.indexOf("b")>0)?true:isFlat(r.pc);
      CATALOG.forEach(function(it){ var sc=matchAlt(it,rest); if(sc>=0) add(r.pc,it,sc,r.n.length,flat); });
    });
    CATALOG.forEach(function(it){ var sc=matchAlt(it,q); if(sc>=0) add(0,it,sc,0,false); });
    res.sort(function(a,b){
      return a.score-b.score || b.rlen-a.rlen || KIND_ORDER[a.it.kind]-KIND_ORDER[b.it.kind] || a.it.order-b.it.order || a.pc-b.pc;
    });
    return res;
  }
}
function sugName(r){
  var f=(r.flat===undefined)?isFlat(r.pc):r.flat, root=nm(r.pc,f);
  return r.it.kind==="chord" ? root+r.it.label : root+" "+r.it.label;
}
var SUG=[], sugIdx=-1, qEl,sugEl,clrEl;
function renderSug(){
  if(!sugEl) return;
  if(!SUG.length){
    var v=qEl.value.trim();
    sugEl.innerHTML = v ? '<div class="sgempty">일치하는 코드 · 스케일 · 모드가 없습니다.</div>' : '';
    sugEl.className = v ? "sugg open" : "sugg";
    return;
  }
  var h="";
  SUG.forEach(function(r,i){
    var f=(r.flat===undefined)?isFlat(r.pc):r.flat;
    var notes=r.it.ivs.map(function(iv){return nm(r.pc+iv,f);}).join(" ");
    h+='<div class="sg'+(i===sugIdx?" sel":"")+'" data-sug="'+i+'">'
      +'<span class="sgkind k-'+r.it.kind+'">'+KIND_KO[r.it.kind]+'</span>'
      +'<span><span class="sgname">'+sugName(r)+'</span><span class="sgko">'+r.it.sub+'</span></span>'
      +'<span class="sgnotes">'+notes+'</span></div>';
  });
  sugEl.innerHTML=h;
  sugEl.className="sugg open";
  var sel=sugEl.querySelector(".sg.sel");
  if(sel && sel.scrollIntoView) sel.scrollIntoView({block:"nearest"});
}
function closeSug(){ if(sugEl){ sugEl.className="sugg"; } sugIdx=-1; }
function updateSug(){
  SUG=searchQ(qEl.value);
  sugIdx=SUG.length?0:-1;
  if(clrEl) clrEl.className="sbclr"+(qEl.value?" on":"");
  renderSug();
}
function pickSug(i){
  var r=SUG[i]; if(!r) return;
  var root=r.pc, ivs=r.it.ivs;
  S.playMode=false;
  S.sel=ivs.map(function(iv){return 60+root+iv;});
  S.moreScale=false; S.moreMode=false; resetRes=true;
  qEl.value=sugName(r);
  if(clrEl) clrEl.className="sbclr on";
  addHist({label:sugName(r),kind:r.it.kind,sel:S.sel.slice()});
  closeSug(); qEl.blur();
  stopSeq(); render(); centerKeyboard();
  if(r.it.kind==="chord") chordPlay(root,ivs,"q-chord");
  else seqPlay(root,ivs,"q-seq",true,false);
}
function clearQuery(){
  if(qEl){ qEl.value=""; SUG=[]; closeSug(); }
  if(clrEl) clrEl.className="sbclr";
}
function initSearch(){
  qEl=$("q"); sugEl=$("sugg"); clrEl=$("qclr");
  if(!qEl) return;
  qEl.addEventListener("input",updateSug);
  qEl.addEventListener("focus",function(){ if(qEl.value) updateSug(); });
  qEl.addEventListener("blur",function(){ setTimeout(closeSug,150); });
  qEl.addEventListener("keydown",function(ev){
    if(ev.key==="ArrowDown"){ ev.preventDefault(); if(SUG.length){ sugIdx=(sugIdx+1)%SUG.length; renderSug(); } }
    else if(ev.key==="ArrowUp"){ ev.preventDefault(); if(SUG.length){ sugIdx=(sugIdx-1+SUG.length)%SUG.length; renderSug(); } }
    else if(ev.key==="Enter"){ ev.preventDefault(); if(sugIdx>=0) pickSug(sugIdx); }
    else if(ev.key==="Escape"){ closeSug(); qEl.blur(); }
  });
  sugEl.addEventListener("pointerdown",function(ev){
    var el=ev.target.closest?ev.target.closest("[data-sug]"):null;
    if(!el) return;
    ev.preventDefault();
    pickSug(+el.getAttribute("data-sug"));
  });
  clrEl.addEventListener("click",function(){ qEl.value=""; SUG=[]; closeSug(); clrEl.className="sbclr"; qEl.focus(); });
}

/* ── 기록 (새로고침 · 다시 시작에도 유지) ──────────────── */
var HKEY="scaleReader.branch.history.v1", HMAX=24, HIST=[];
function loadHist(){
  try{
    var v=JSON.parse(localStorage.getItem(HKEY)||"[]");
    HIST=(Array.isArray(v)?v:[]).filter(function(x){
      return x && typeof x.label==="string" && Array.isArray(x.sel) && x.sel.length &&
             x.sel.every(function(m){return typeof m==="number" && m>=48 && m<=83;});
    }).slice(0,HMAX);
    /* 예전에 저장된 기호 표기(\u266D \u266F)를 b · # 로 정리 */
    var fixed=false;
    HIST.forEach(function(x){ var l=x.label.replace(/\u266D/g,'b').replace(/\u266F/g,'#'); if(l!==x.label){ x.label=l; fixed=true; } });
    if(fixed) saveHist();
  }catch(e){ HIST=[]; }
}
function saveHist(){ try{ localStorage.setItem(HKEY,JSON.stringify(HIST.slice(0,HMAX))); }catch(e){} }
function addHist(item){
  var key=item.sel.slice().sort(function(a,b){return a-b;}).join(",");
  for(var i=0;i<HIST.length;i++){
    if(HIST[i].sel.slice().sort(function(a,b){return a-b;}).join(",")===key){
      var old=HIST.splice(i,1)[0]; HIST.unshift(old); saveHist(); renderHist(); return;
    }
  }
  HIST.unshift({label:item.label,kind:item.kind,sel:item.sel.slice()});
  if(HIST.length>HMAX) HIST.length=HMAX;
  saveHist(); renderHist();
}
function selInfo(){
  var pcs=[]; S.sel.forEach(function(m){ if(pcs.indexOf(mod(m))<0) pcs.push(mod(m)); });
  pcs.sort(function(a,b){return a-b;});
  var bass=mod(Math.min.apply(null,S.sel));
  if(pcs.length>=2){
    var c=findChords(pcs,bass);
    if(c.exact.length){
      var e=c.exact[0], f=isFlat(e.root);
      return {label:nm(e.root,f)+e.c.sym+(bass!==e.root?"/"+nm(bass,f):""),kind:"chord"};
    }
  }
  var fl=isFlat(bass);
  return {label:S.sel.map(function(m){return nm(m,fl);}).join(" "),kind:"keys"};
}
function snapshotSel(){ if(!S.sel.length) return; var inf=selInfo(); addHist({label:inf.label,kind:inf.kind,sel:S.sel.slice()}); }
function renderHist(){
  var sc=$("hscroll"); if(!sc) return;
  if(!HIST.length){
    sc.innerHTML='<span class="hempty">최근 기록 · 입력, RESET, 새로고침 때 여기에 쌓입니다</span>';
  } else {
    sc.innerHTML=HIST.map(function(h,i){
      return '<button class="hc" type="button" data-h="'+i+'"><span class="hd hd-'+(h.kind||"keys")+'"></span>'+h.label.replace(/</g,"&lt;")+'</button>';
    }).join("");
  }
  var cb=$("hclr"); if(cb) cb.className="hclr"+(HIST.length?" on":"");
  updHistFade();
}
function updHistFade(){
  var wrap=$("hwrap"), sc=$("hscroll"); if(!wrap||!sc) return;
  var l=sc.scrollLeft>2, r=sc.scrollLeft+sc.clientWidth<sc.scrollWidth-2;
  wrap.className="hwrap"+(l?" can-l":"")+(r?" can-r":"");
}
function restoreHist(i){
  var h=HIST[i]; if(!h) return;
  var sel=h.sel.slice().sort(function(a,b){return a-b;});
  stopSeq();
  S.playMode=false; S.sel=sel; S.moreScale=false; S.moreMode=false; resetRes=true;
  clearQuery(); render(); centerKeyboard();
  var root=sel[0]-60, ivs=sel.map(function(m){return m-sel[0];});
  if(h.kind==="scale"||h.kind==="mode") seqPlay(root,ivs,"h-seq",true,false);
  else chordPlay(root,ivs,"h-chord");
}
function initHist(){
  loadHist(); renderHist();
  var sc=$("hscroll"); if(!sc) return;
  sc.addEventListener("scroll",updHistFade,{passive:true});
  sc.addEventListener("wheel",function(ev){
    if(Math.abs(ev.deltaY)>Math.abs(ev.deltaX)){ sc.scrollLeft+=ev.deltaY; ev.preventDefault(); }
  },{passive:false});
  sc.addEventListener("click",function(ev){
    var c=ev.target.closest?ev.target.closest("[data-h]"):null;
    if(!c) return;
    restoreHist(+c.getAttribute("data-h"));
  });
  var cb=$("hclr"), ct=$("hclrtxt"), armT=null;
  if(cb) cb.addEventListener("click",function(){
    if(cb.className.indexOf("arm")<0){
      cb.className="hclr on arm"; ct.textContent="한 번 더 누르면 삭제";
      clearTimeout(armT);
      armT=setTimeout(function(){ ct.textContent="비우기"; renderHist(); },2500);
      return;
    }
    clearTimeout(armT);
    HIST=[]; saveHist(); ct.textContent="비우기"; renderHist();
  });
  window.addEventListener("resize",updHistFade);
  window.addEventListener("pagehide",snapshotSel);
  window.addEventListener("beforeunload",snapshotSel);
}


/* ── 전체 스크롤 모드 · 오버레이 스크롤바 ───────────── */
/* 상단 고정부가 화면의 62% 이상을 차지하면(가로 모드 등) 상단 패널부터 사용 가이드까지 한 번에 스크롤 */
var FLOW=false, sbRAF=0, sbActT=null;
function scroller(){ return FLOW?document.querySelector('.wrap'):$('results'); }
function updateFlow(){
  var top=$('top'); if(!top) return;
  var vh=window.innerHeight||document.documentElement.clientHeight;
  var need=top.offsetHeight>vh*0.62 || vh<460;
  if(need!==FLOW){ FLOW=need; document.body.classList.toggle('flow',FLOW); }
  schedSB();
}
function schedSB(){ if(sbRAF) return; sbRAF=requestAnimationFrame(function(){ sbRAF=0; drawSB(); }); }
function sbGeom(){
  var sc=scroller(), r=sc.getBoundingClientRect(), vh=window.innerHeight;
  var top=Math.max(0,r.top)+3, h=Math.min(r.bottom,vh)-top-3;
  var sh=sc.scrollHeight, ch=sc.clientHeight, thH=Math.max(28,h*ch/sh);
  return {sc:sc,top:top,h:h,sh:sh,ch:ch,thH:thH};
}
function drawSB(){
  var tr=$('oscroll'), th=$('othumb'); if(!tr||!th) return;
  var g=sbGeom();
  if(g.sh<=g.ch+2||g.h<40){ tr.hidden=true; return; }
  tr.hidden=false;
  tr.style.top=g.top+'px'; tr.style.height=g.h+'px';
  th.style.height=g.thH+'px';
  th.style.transform='translateY('+((g.h-g.thH)*g.sc.scrollTop/(g.sh-g.ch))+'px)';
}
function sbFlash(){
  var tr=$('oscroll'); if(!tr) return;
  tr.classList.add('act'); clearTimeout(sbActT);
  sbActT=setTimeout(function(){ tr.classList.remove('act'); },900);
}
function initSB(){
  var tr=$('oscroll'), wrap=document.querySelector('.wrap'), res=$('results');
  [wrap,res].forEach(function(el){ el.addEventListener('scroll',function(){ schedSB(); sbFlash(); },{passive:true}); });
  window.addEventListener('resize',updateFlow);
  window.addEventListener('orientationchange',function(){ setTimeout(updateFlow,200); });
  if(window.ResizeObserver){ var ro=new ResizeObserver(function(){ updateFlow(); }); ro.observe($('top')); ro.observe(res); }
  /* 드래그 · 트랙 탭으로 이동 */
  var drag=null;
  tr.addEventListener('pointerdown',function(ev){
    ev.preventDefault();
    var g=sbGeom(), tb=$('othumb').getBoundingClientRect();
    var grab=(ev.clientY>=tb.top&&ev.clientY<=tb.bottom)?ev.clientY-tb.top:g.thH/2;
    drag={grab:grab,id:ev.pointerId};
    try{ tr.setPointerCapture(ev.pointerId); }catch(e){}
    tr.classList.add('drag');
    sbMove(ev.clientY);
  },{passive:false});
  function sbMove(y){
    var g=sbGeom(), span=g.h-g.thH; if(span<=0) return;
    var ratio=Math.max(0,Math.min(1,(y-g.top-drag.grab)/span));
    g.sc.scrollTop=ratio*(g.sh-g.ch);
    drawSB();
  }
  tr.addEventListener('pointermove',function(ev){ if(!drag||ev.pointerId!==drag.id) return; ev.preventDefault(); sbMove(ev.clientY); },{passive:false});
  ['pointerup','pointercancel'].forEach(function(t){ tr.addEventListener(t,function(){ drag=null; tr.classList.remove('drag'); sbFlash(); }); });
}


/* 로고 장평: 확대된 만큼 옆 요소와 겹치지 않게 여백 확보 */
function fitLogo(){
  var sc=document.querySelector('.brand .script'); if(!sc) return;
  sc.style.marginRight=(sc.offsetWidth*0.14).toFixed(1)+'px';
}
window.addEventListener('resize',fitLogo);
try{ if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitLogo); }catch(e){}

/* ── 시작 ───────────────────────────────────────────── */
buildTextures();
initVU();
initKnob();
buildKb();
initSearch();
initHist();
fitLogo();
render();
initSB();
updateFlow();
requestAnimationFrame(function(){ centerKeyboard(); updHistFade(); updateFlow(); });
requestAnimationFrame(vuTick);

/* 스플래시: 원본과 동일 (1.5초 노출 후 사라짐) */
(function(){
  var sp=$("splash");
  if(!sp) return;
  setTimeout(function(){
    sp.className="out";
    setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); },320);
  },1500);
})();
