<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>스케일 리더 · 3옥타브 실시간 하모니 분석</title>
<style>
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;background:#0a0a0a;height:100%}
  body{margin:0;background:#0a0a0a;color:#e5e5e5;
       height:100vh;height:100dvh;overflow:hidden;
       padding:calc(7px + env(safe-area-inset-top)) calc(11px + env(safe-area-inset-right))
               calc(5px + env(safe-area-inset-bottom)) calc(11px + env(safe-area-inset-left));
       -webkit-tap-highlight-color:transparent;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"D2Coding",monospace}
  /* 한글이 섞이는 요소는 고정폭에서 제외 — 고정폭 글꼴에서 공백이 전각처럼 벌어지는 문제 방지 */
  .eyebrow,.note,.sub,.plabel,.fam,.ko,.name,.pbtn,.cbtn,.more,.empty,.thint,.tab b,
  .kbarrow,.kbcenter,.sgkind,.sgname,.sgko,.tips,.tips li,.tipshead,
  .tab i,table th,td.first,td.kotd{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif !important;
    word-spacing:normal}
  .wrap{max-width:1040px;margin:0 auto;height:100%;display:flex;flex-direction:column;min-height:0}
  #top{flex:0 0 auto}
  #results{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
           -webkit-overflow-scrolling:touch;padding:8px 0 4px}
  .mt{margin-top:6px}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;
         touch-action:manipulation;-webkit-user-select:none;user-select:none}
  button:focus-visible{outline:2px solid #5eead4;outline-offset:1px}

  .card{border:1px solid #262626;background:#171717;border-radius:12px}
  .eyebrow{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:#8a8a8a;line-height:1.2}
  h1{margin:0;font-size:19px;letter-spacing:-.02em;color:#f5f5f5;line-height:1.2}

  .head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .icon-btn{border:1px solid #262626;background:#171717;border-radius:7px;padding:5px 9px;color:#a3a3a3;font-size:13px}
  .icon-btn:hover{color:#fbbf24}
  .fsbtn{display:inline-flex;align-items:center;justify-content:center;padding:6px 10px}
  .fsbtn.on{color:#fbbf24;border-color:#3f2d06}
  .amber-btn{background:#fbbf24;color:#171717;font-weight:600;border-radius:7px;padding:6px 11px;font-size:12px}
  .amber-btn:hover{background:#fcd34d}

  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .tab{background:#262626;color:#a3a3a3;border-radius:6px;padding:7px 3px;text-align:center}
  .tab:hover{color:#f5f5f5}
  .tab.on{background:#fbbf24;color:#171717}
  .tab b{display:block;font-size:14px;line-height:1.2}
  .thint{font-size:0.70em;font-weight:500;opacity:.72;letter-spacing:0;margin-left:3px}
  .tab i{display:block;font-style:normal;font-size:9.5px;line-height:1.15;margin-top:1px;color:#8a8a8a}
  .tab.on i{color:#3f2d06}
  .tab.on .thint{color:#3f2d06;opacity:.85}
  .note{font-size:9.5px;color:#6e6e6e;padding:4px 3px 0;line-height:1.3}

  .readout{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px}
  .headline{font-size:28px;font-weight:700;color:#5eead4;letter-spacing:-.02em;line-height:1.05}
  .pick{display:inline-block;background:#fbbf24;color:#171717;font-weight:700;font-size:12px;
        padding:1px 6px;border-radius:4px;margin:3px 3px 0 0}
  .sub{font-size:9.5px;color:#8a8a8a;margin-top:3px}

  /* 시작 스플래시 */
  #splash{position:fixed;inset:0;z-index:999;background:#0A0A0B;
          display:flex;align-items:center;justify-content:center;
          transition:opacity .28s ease}
  #splash.out{opacity:0;pointer-events:none}
  #splash img{width:44vmin;max-width:220px;min-width:128px;
              border-radius:22%;display:block;
              animation:splashIn .5s ease-out both}
  @keyframes splashIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
  @media (prefers-reduced-motion: reduce){#splash img{animation:none}}
  /* 히스토리 스트립 (입력창 바로 위) */
  .hist{position:relative;margin-top:6px;height:24px;display:flex;align-items:center;gap:7px}
  .hwrap{position:relative;flex:1 1 auto;min-width:0;height:100%}
  .hscroll{display:flex;align-items:center;gap:5px;height:100%;overflow-x:auto;overflow-y:hidden;
           scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain;
           -webkit-overflow-scrolling:touch}
  .hscroll::-webkit-scrollbar{display:none}
  .hwrap::before,.hwrap::after{content:"";position:absolute;top:0;bottom:0;width:26px;z-index:2;
           pointer-events:none;opacity:0;transition:opacity .15s}
  .hwrap::before{left:0;background:linear-gradient(to right,#0a0a0a 10%,rgba(10,10,10,0))}
  .hwrap::after{right:0;background:linear-gradient(to left,#0a0a0a 10%,rgba(10,10,10,0))}
  .hwrap.can-l::before{opacity:1}
  .hwrap.can-r::after{opacity:1}
  .hc{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;
      border-radius:11px;background:#1b1b1b;border:1px solid #2e2e2e;color:#c8c8c8;
      font-size:11px;white-space:nowrap;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif}
  .hc:active{background:#2b2b2b;border-color:#5eead4}
  .hc .hd{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
  .hd-chord{background:#5eead4}
  .hd-scale{background:#fbbf24}
  .hd-mode{background:#b4b4b4}
  .hd-keys{background:#6e6e6e}
  .hclr{flex:0 0 auto;display:none;align-items:center;gap:3px;height:22px;padding:0 1px 0 8px;
        border-left:1px solid #2e2e2e;color:#b98080;font-size:10.5px;white-space:nowrap;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif}
  .hclr.on{display:inline-flex}
  .hclr .x{font-size:11px;line-height:1}
  .hclr:active{color:#f5b4b4}
  .hclr.arm{color:#fca5a5;font-weight:600}
  .hempty{font-size:10px;color:#6e6e6e;white-space:nowrap;padding-left:2px;
          font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif}

  /* 직접 입력 검색창 */
  .sbwrap{position:relative;margin-top:6px}
  .sb{display:flex;align-items:center;gap:7px;border:1px solid #303030;background:#171717;
      border-radius:9px;padding:0 9px}
  .sb:focus-within{border-color:#5eead4}
  .sb input{flex:1;min-width:0;background:none;border:none;outline:none;color:#f5f5f5;
            font-size:14px;padding:7px 0;font-family:inherit}
  .sb input::placeholder{color:#636363}
  .sbico{font-size:13px;color:#8a8a8a}
  .sbclr{color:#8a8a8a;font-size:13px;padding:3px 2px;display:none}
  .sbclr.on{display:block}
  .sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:60;background:#171717;
        border:1px solid #404040;border-radius:10px;max-height:44vh;overflow-y:auto;
        box-shadow:0 14px 30px rgba(0,0,0,.65);display:none}
  .sugg.open{display:block}
  .sg{display:flex;align-items:center;gap:7px;padding:7px 9px;border-bottom:1px solid #222;cursor:pointer}
  .sg:last-child{border-bottom:none}
  .sg.sel,.sg:hover{background:#262626}
  .sgkind{font-size:9px;letter-spacing:.01em;border-radius:4px;padding:2px 5px;flex:0 0 auto}
  .k-chord{background:#134e4a;color:#5eead4}
  .k-scale{background:#3f2d06;color:#fbbf24}
  .k-mode{background:#333;color:#d4d4d4}
  .sgname{font-size:13px;color:#f5f5f5;font-weight:600}
  .sgko{font-size:10px;color:#9b9b9b;margin-left:5px}
  .sgnotes{margin-left:auto;font-size:10px;color:#7e7e7e;white-space:nowrap}
  .sgempty{padding:10px;font-size:12px;color:#8a8a8a}
  @media(max-width:430px){.sgnotes{display:none}}

  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .kbwrap{position:relative}
  .kbnav{display:flex;align-items:center;gap:6px;padding:0 7px 7px}
  .kbarrow{flex:0 0 auto;width:32px;height:26px;border:1px solid #333;border-radius:7px;
           background:#1f1f1f;color:#a3a3a3;font-size:11px;line-height:1}
  .kbarrow:active{background:#3a3a3a;color:#fbbf24}
  .kbtrack{flex:1 1 auto;position:relative;height:24px;border-radius:12px;background:#202020;
           border:1px solid #2f2f2f;touch-action:none;cursor:grab;overflow:hidden}
  .kbtrack:active{cursor:grabbing}
  .kbthumb{position:absolute;top:3px;bottom:3px;left:0;width:33%;border-radius:10px;
           background:#4a4a4a;box-shadow:inset 0 0 0 1px #6b6b6b;pointer-events:none}
  .kbthumb::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:2px;
                  transform:translate(-50%,-50%);border-radius:1px;background:#8a8a8a;
                  box-shadow:0 4px 0 #8a8a8a,0 -4px 0 #8a8a8a}
  .kbtrack.drag .kbthumb{background:#fbbf24}
  .kbtrack.drag .kbthumb::after{background:#7c5806;box-shadow:0 4px 0 #7c5806,0 -4px 0 #7c5806}
  .kbcenter{flex:0 0 auto;height:26px;padding:0 9px;border:1px solid #333;border-radius:7px;
            background:#1f1f1f;color:#a3a3a3;font-size:10px}
  .kbcenter:active{background:#3a3a3a;color:#fbbf24}
  .kbcenter.on{background:#fbbf24;border-color:#d97706;color:#171717;font-weight:600}
  .kb{position:relative;height:134px;min-width:720px;touch-action:pan-x}
  .kb.play,.kb.play .wk,.kb.play .bk{touch-action:none}
  /* ── 흰 건반 : 상아색 그라디언트 + 측면 음영 + 앞면 두께 ── */
  .wk{position:absolute;top:0;bottom:0;border:none;border-radius:0 0 7px 7px;
      background:linear-gradient(180deg,#fbfbfa 0%,#ffffff 52%,#f2f2ee 86%,#dcdcd6 96%,#c4c4bd 100%);
      box-shadow:inset -3px 0 5px -2px rgba(0,0,0,.30),
                 inset 2px 0 0 rgba(255,255,255,.95),
                 inset 0 -9px 10px -8px rgba(0,0,0,.45),
                 0 3px 4px rgba(0,0,0,.45);
      display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;
      font-size:10px;font-weight:600;color:#8f8f8a;touch-action:pan-x;overflow:hidden}
  /* 표면 반사 */
  .wk::after{content:"";position:absolute;inset:0 0 auto 0;height:46%;pointer-events:none;
             background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0));}
  .wk:hover{filter:brightness(1.04)}
  .wk:active{background:linear-gradient(180deg,#fde9b4 0%,#fcd982 55%,#f0c45c 100%)}
  .wk.cur{background:linear-gradient(180deg,#c6fbef 0%,#99f6e4 52%,#6ee0cb 88%,#4cc3ae 100%);color:#2b4f49}
  .wk.on{background:linear-gradient(180deg,#fee08c 0%,#fbbf24 52%,#eda50c 88%,#c9860a 100%);color:#3a2703}
  .wk.on.cur{background:linear-gradient(180deg,#e2ecb0 0%,#cada84 52%,#b3c665 88%,#93a648 100%);color:#2c3208;
             outline:2px solid #2dd4bf;outline-offset:-2px}
  .wk.on.echo{outline:2px solid #93b84a;outline-offset:-2px}

  /* ── 검은 건반 : 광택과 앞면 경사 ── */
  .bk{position:absolute;top:0;height:calc((100% - 4px) * 0.5415 + 3.8px);z-index:10;
      border:none;border-radius:0 0 6px 6px;
      background:linear-gradient(180deg,#3b3b40 0%,#252529 22%,#18181b 58%,#101012 88%,#232327 100%);
      box-shadow:inset 0 1px 1px rgba(255,255,255,.16),
                 inset -2px 0 3px -2px rgba(0,0,0,.65),
                 0 4px 6px -3px rgba(0,0,0,.5);
      display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;
      font-size:10px;font-weight:600;color:#a0a0a5;touch-action:pan-x;overflow:hidden}
  /* 광택 줄무늬 */
  /* 좁은 세로 하이라이트 : 왼쪽 모서리 가까이 */
  .bk::after{content:"";position:absolute;left:9%;top:0;width:10%;height:60%;pointer-events:none;
             border-radius:0 0 60% 60%;
             background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.06) 55%,rgba(255,255,255,0));}
  .bk:hover{filter:brightness(1.18)}
  .bk:active{background:linear-gradient(180deg,#a9660f 0%,#7c440a 40%,#4a2705 85%,#2a1503 100%)}
  .bk.cur{background:linear-gradient(180deg,#3ad6c2 0%,#14a394 30%,#0b6f66 78%,#053c37 100%);color:#e8fffb}
  .bk.on{background:linear-gradient(180deg,#fcd77a 0%,#f59e0b 34%,#c17a06 82%,#7a4c03 100%);color:#2e1c02}
  .bk.on.cur{background:linear-gradient(180deg,#b3c97e 0%,#819949 34%,#5c6e33 82%,#39441f 100%);color:#f2f7e6;
             outline:2px solid #5eead4;outline-offset:-2px}
  .bk.on.echo{outline:2px solid #bcd98d;outline-offset:-2px}

  .grid3{display:grid;gap:12px}
  @media(min-width:900px){.grid3{grid-template-columns:repeat(3,1fr)}}

  /* 화면이 넉넉하면 상단을 조금 여유 있게 */
  @media(min-height:940px){
    body{padding-top:calc(12px + env(safe-area-inset-top))}
    h1{font-size:23px}
    .kb{height:163px}
    .readout{padding:10px 15px}
    .headline{font-size:34px}
    .mt{margin-top:9px}
  }
  /* 세로가 짧은 기기: 상단을 더 압축해 결과 영역 확보 */
  @media(max-height:700px){
    .note{display:none}
    h1{font-size:17px}
    .kb{height:107px}
    .headline{font-size:24px}
    .tab i{display:none}
    .mt{margin-top:5px}
    #results{padding-top:6px}
  }
  .phead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid #262626;padding:10px 16px}
  .plabel{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#f59e0b}
  .pcount{font-size:11px;color:#8a8a8a}
  .pbody{padding:12px}
  .empty{font-size:13px;color:#8a8a8a;margin:2px 0}

  .item{background:#262626;border-radius:8px;padding:9px 12px;margin-bottom:8px}
  .sym{font-size:18px;font-weight:700;color:#5eead4}
  .ko{font-size:11px;color:#a3a3a3;margin-left:6px}
  .deg{font-size:11px;color:#8a8a8a;margin-top:2px}
  .name{font-size:13px;font-weight:600;color:#f5f5f5}
  .fam{font-size:11px;color:#8a8a8a;margin-left:6px}
  .chips{margin-top:6px}
  .chip{display:inline-block;background:#171717;color:#a3a3a3;font-size:11px;padding:2px 6px;border-radius:4px;margin:2px 3px 0 0}
  .chip.on{background:#fbbf24;color:#171717;font-weight:600}

  .pbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
  .pbtn{background:#404040;color:#d4d4d4;border-radius:4px;padding:8px 4px;font-size:11px;white-space:nowrap;text-align:center}
  .pbtn:hover{background:#525252}
  .pbtn.on{background:#fbbf24;color:#171717;font-weight:600}
  .cbtn{grid-column:1/-1;background:#134e4a;color:#5eead4;font-weight:600}
  .cbtn:hover{background:#115e59}
  .cbtn.on{background:#5eead4;color:#134e4a}
  .more{width:100%;border:1px solid #404040;border-radius:6px;padding:8px;font-size:11px;color:#a3a3a3;margin-top:4px}
  .more:hover{color:#fbbf24}

  table{width:100%;border-collapse:collapse;min-width:560px;text-align:left}
  th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#8a8a8a;font-weight:400;padding:8px 12px;border-bottom:1px solid #404040}
  td{padding:10px 12px;border-bottom:1px solid #262626;font-size:13px;color:#adadad}
  td.first{color:#f5f5f5;font-weight:600}
  .alt{color:#fbbf24;font-weight:700}
  .tips{list-style:none;margin:14px 2px 10px;padding:0}
  .tipshead{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#6e6e6e;margin:0 2px 7px}
  .tips li{position:relative;padding-left:17px;font-size:11px;color:#808080;line-height:1.55;margin-bottom:5px}
  .tips li::before{content:"✓";position:absolute;left:0;top:0;color:#5aa89c;font-size:10px;font-weight:700}
</style>

function eq(a,b){ if(a.length!==b.length) return false; for(var i=0;i<a.length;i++) if(a[i]!==b[i]) return false; return true; }
function findChords(pcs,bass){
  var exact=[],root,ivs,i;
  for(root=0;root<12;root++){
    if(pcs.indexOf(root)<0) continue;
    ivs=pcs.map(function(p){return mod(p-root);}).sort(function(a,b){return a-b;});
    for(i=0;i<CHORDS.length;i++) if(eq(ivs,CHORDS[i].ivs)) exact.push({root:root,c:CHORDS[i]});
  }
  exact.sort(function(a,b){return (b.root===bass)-(a.root===bass);});
  if(exact.length) return {exact:exact,near:[]};
  var near=[];
  for(root=0;root<12;root++){
    CHORDS.forEach(function(c){
      var set=c.ivs.map(function(iv){return mod(iv+root);});
      var r=root;
      if(c.ivs.length>pcs.length && c.ivs.length-pcs.length<=2 &&
         pcs.every(function(p){return set.indexOf(p)>=0;}))
        near.push({root:r,c:c,missing:c.ivs.length-pcs.length});
    });
  }
  near.sort(function(a,b){return a.missing-b.missing || (b.root===bass)-(a.root===bass);});
  return {exact:[],near:near.slice(0,8)};
}
function matchScales(list,pcs,bass){
  var out=[];
  for(var root=0;root<12;root++){
    list.forEach(function(s){
      var r=root, notes=s.ivs.map(function(iv){return mod(iv+r);});
      if(pcs.every(function(p){return notes.indexOf(p)>=0;})) out.push({root:r,s:s,notes:notes});
    });
  }
  out.sort(function(a,b){
    return (b.root===bass)-(a.root===bass) || a.notes.length-b.notes.length || a.root-b.root;
  });
  return out;
}

var PARTIALS=[

function ensureAudio(){
  try{
    if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx && !master){
      var comp=ctx.createDynamicsCompressor();
      comp.threshold.value=-14; comp.knee.value=8; comp.ratio.value=3.5;
      comp.attack.value=0.003;  comp.release.value=0.25;
      master=ctx.createGain(); master.gain.value=1.15;
      master.connect(comp); comp.connect(ctx.destination);
    }
    if(ctx.state!=="running"){
      ctx.resume();
      /* 무음 버퍼 1샘플 — 모바일 브라우저에서 컨텍스트를 확실히 깨움 */
      try{
        var b=ctx.createBufferSource();
        b.buffer=ctx.createBuffer(1,1,22050);
        b.connect(ctx.destination); b.start(0);
      }catch(e){}
    }
  }catch(e){}
}
function play(written,dur,vol){
  if(!S.sound) return;
  dur=dur||3.2; vol=vol||0.48;
  var midi=written-offset();               /* 표기는 기보음, 소리는 실음 */
  ensureAudio();
  if(!ctx||!master) return;
  if(ctx.state==="running"){ voice(midi,dur,vol); return; }
  /* 아직 깨어나지 않았으면 예약하지 말고, 깨어난 직후에 발음
     (예약해 두면 나중에 밀린 음이 한꺼번에 터짐) */
  try{ ctx.resume().then(function(){ voice(midi,dur,vol); },function(){}); }
  catch(e){}
}
function voice(midi,dur,vol){
  try{
    if(!ctx||!master) return;
    var t=ctx.currentTime, f=440*Math.pow(2,(midi-69)/12);

    /* 앰프 엔벨로프: 부드러운 어택 → 길게 유지 → 완만한 릴리즈
       (타격 후 바로 죽는 "땡"이 아니라 이어서 울리는 "따안~") */
    var atk=Math.min(0.018,dur*0.05);
    var rel=Math.min(0.55,dur*0.35);
    var amp=ctx.createGain();
    amp.gain.setValueAtTime(0.0001,t);
    amp.gain.exponentialRampToValueAtTime(vol,t+atk);
    amp.gain.exponentialRampToValueAtTime(vol*0.82,t+Math.min(0.22,dur*0.18));
    amp.gain.exponentialRampToValueAtTime(vol*0.62,t+dur-rel);   /* 유지 구간 */
    amp.gain.exponentialRampToValueAtTime(0.0001,t+dur);          /* 부드러운 소멸 */

    /* 로우패스: 고역을 급히 닫지 않고 완만하게 — 음색이 끝까지 살아 있게 */
    var lp=ctx.createBiquadFilter();
    lp.type="lowpass"; lp.Q.value=0.9;
    lp.frequency.setValueAtTime(Math.min(18000,f*22),t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(1600,Math.min(16000,f*11)),t+Math.min(1.2,dur*0.8));
    amp.connect(lp); lp.connect(master);

    PARTIALS.forEach(function(v){
      var o=ctx.createOscillator(), og=ctx.createGain();
      o.type=v[0]; o.frequency.value=f*v[1];
      og.gain.setValueAtTime(v[2],t);
      og.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(0.15,dur*v[3]));
      o.connect(og); og.connect(amp);
      o.start(t); o.stop(t+dur+0.05);
    });
  }catch(e){}
}

function stopSeq(){ timers.forEach(clearTimeout); timers=[]; S.playingId=null; S.curMidis=[]; }
function seqPlay(root,ivs,id,addOct,desc){
  var was=S.playingId===id;
  stopSeq();
  if(was){ render(); return; }
  var steps=addOct?ivs.concat([12]):ivs.slice();
  if(desc) steps.reverse();
  var midis=steps.map(function(iv){return 60+root+iv;});
  S.playingId=id;
  midis.forEach(function(m,i){
    timers.push(setTimeout(function(){ play(m,BEAT/1000*2.25); S.curMidis=[m]; render(); }, i*BEAT));
  });
  timers.push(setTimeout(function(){ stopSeq(); render(); }, midis.length*BEAT));
  render();
}
/* 화음 동시 재생 — 누른 음은 그 옥타브 그대로 쓰고, 빠진 구성음만 채워 넣음 */
function chordMidis(root,ivs){
  var want=ivs.map(function(iv){return mod(root+iv);});
  var out=[];
  S.sel.forEach(function(m){ if(want.indexOf(mod(m))>=0) out.push(m); });
  var base=out.length?Math.min.apply(null,out):60+root;
  want.forEach(function(pc){
    var has=false;
    out.forEach(function(m){ if(mod(m)===pc) has=true; });
    if(has) return;
    var m=base+mod(pc-mod(base));          /* 최저음 위쪽에서 가장 가까운 자리 */
    while(m>83) m-=12;
    while(m<48) m+=12;
    out.push(m);
  });
  out.sort(function(a,b){return a-b;});
  return out;
}
function chordPlay(root,ivs,id){
  stopSeq();                               /* 재생 중이라도 누를 때마다 바로 다시 울림 */
  var midis=chordMidis(root,ivs);
  if(!midis.length) midis=ivs.map(function(iv){return 60+root+iv;});
  var vol=Math.max(0.14, 0.52/Math.sqrt(midis.length));   /* 음 수가 많아도 클리핑 방지 */
  var dur=3.33;          /* 동시 듣기 여음 추가 20% 단축 */
  S.playingId=id;
  S.curMidis=midis.slice();
  midis.forEach(function(m){ play(m,dur,vol); });
  timers.push(setTimeout(function(){ stopSeq(); render(); }, dur*1000*0.8));
  render();
}

function centerKeyboard(){ kbScroll=null; }
function applyKbScroll(){
  var el=document.getElementById("kbscroll");
  if(!el) return;
  var max=el.scrollWidth-el.clientWidth;
  if(max>0) el.scrollLeft = (kbScroll===null) ? max/2 : Math.min(kbScroll,max);
  if(!el._bound){ el._bound=1; el.addEventListener("scroll",updateThumb,{passive:true}); }
  updateThumb();
}

/* 건반 아래 스크롤 핸들 */
function updateThumb(){
  var kb=document.getElementById("kbscroll"),
      tr=document.getElementById("kbtrack"),
      th=document.getElementById("kbthumb");
  if(!kb||!tr||!th) return;
  var sw=kb.scrollWidth, cw=kb.clientWidth;
  if(sw<=cw+1){ tr.style.opacity="0.35"; th.style.width="100%"; th.style.left="0"; return; }
  tr.style.opacity="1";
  var w=Math.max(16,(cw/sw)*100);
  var p=kb.scrollLeft/(sw-cw);
  th.style.width=w+"%";
  th.style.left=(Math.max(0,Math.min(1,p))*(100-w))+"%";
}
var kbDrag=false, kbGrab=0;
function trackMove(clientX){
  var kb=document.getElementById("kbscroll"),
      tr=document.getElementById("kbtrack"),
      th=document.getElementById("kbthumb");
  if(!kb||!tr||!th) return;
  var r=tr.getBoundingClientRect(), tw=th.offsetWidth, span=r.width-tw;
  if(span<=0) return;
  var x=Math.max(0,Math.min(span,clientX-r.left-kbGrab));
  var max=kb.scrollWidth-kb.clientWidth;
  kb.scrollLeft=max*(x/span);
  kbScroll=kb.scrollLeft;
  updateThumb();
}
document.addEventListener("pointerdown",function(ev){
  var tr=ev.target.closest?ev.target.closest("#kbtrack"):null;
  if(!tr) return;
  ev.preventDefault();
  var th=document.getElementById("kbthumb");
  var tb=th.getBoundingClientRect();
  kbGrab=(ev.clientX>=tb.left&&ev.clientX<=tb.right)?(ev.clientX-tb.left):tb.width/2;
  kbDrag=true; tr.className="kbtrack drag";
  try{ tr.setPointerCapture(ev.pointerId); }catch(e){}
  trackMove(ev.clientX);
},{passive:false});
document.addEventListener("pointermove",function(ev){
  if(!kbDrag) return;
  ev.preventDefault();
  trackMove(ev.clientX);
},{passive:false});
["pointerup","pointercancel"].forEach(function(t){
  document.addEventListener(t,function(){
    if(!kbDrag) return;
    kbDrag=false;
    var tr=document.getElementById("kbtrack");
    if(tr) tr.className="kbtrack";
  });
});

function playBtns(root,ivs,id,addOct,pcs,withChord){
  var selIvs=ivs.filter(function(iv){return pcs.indexOf(mod(root+iv))>=0;});
  var partial=selIvs.length>0 && selIvs.length<ivs.length;
  var total=ivs.length+(addOct?1:0);
  function b(bid,list,oct,desc,text){
    return '<button class="pbtn mono'+(S.playingId===bid?' on':'')+'" data-act="play" data-root="'+root+
      '" data-ivs="'+list.join(',')+'" data-id="'+bid+'" data-oct="'+(oct?1:0)+'" data-desc="'+(desc?1:0)+'">▶ '+text+'</button>';
  }
  var h='<div class="pbtns">';

    var cid=id+'-chord';
    h+='<button class="pbtn cbtn mono'+(S.playingId===cid?' on':'')+'" data-act="chord" data-root="'+root+
       '" data-ivs="'+ivs.join(',')+'" data-id="'+cid+'">♫ 동시 듣기 · '+ivs.length+'음 화음</button>';
  }
  h+=b(id+'-all-up',ivs,addOct,false,'전체 '+total+'음 (상행)');
  h+=b(id+'-all-dn',ivs,addOct,true ,'전체 '+total+'음 (하행)');

    h+=b(id+'-sel-dn',selIvs,false,true ,'누른 음 '+selIvs.length+' (하행)');
  }

}

function flashKey(el){
  if(!el) return;
  if(el.className.indexOf(" cur")<0) el.className+=" cur";
  setTimeout(function(){ el.className=el.className.replace(/ cur/g,""); },200);
}
/* 연주 모드: 누르고 있는 동안 표시 유지 (손가락마다 따로 추적 → 동시 누르기 지원) */
var heldKeys={};
function holdKey(el,pid){
  if(!el) return;
  if(el.className.indexOf(" cur")<0) el.className+=" cur";
  heldKeys[pid]=el;
}
function releaseKey(pid){
  var el=heldKeys[pid];
  if(!el) return;
  el.className=el.className.replace(/ cur/g,"");
  delete heldKeys[pid];
}
function releaseAllKeys(){ for(var k in heldKeys) releaseKey(k); }
["pointerup","pointercancel"].forEach(function(t){
  document.addEventListener(t,function(ev){ releaseKey(ev.pointerId); },{passive:true});
});
window.addEventListener("blur",releaseAllKeys);

function toggleKey(midi,el,pid){
  if(S.playMode){                                   /* 연주 모드: 눌린 상태로 남기지 않음 */
    play(midi,2.2);
    if(pid===undefined) flashKey(el); else holdKey(el,pid);
    return;
  }
  var i=S.sel.indexOf(midi);
  if(i>=0) S.sel.splice(i,1);
  else { S.sel.push(midi); S.sel.sort(function(x,y){return x-y;}); play(midi); }
  S.moreScale=false; S.moreMode=false;
  if(typeof clearQuery==="function") clearQuery();
  if(kbScroll===null){                       /* 가운데 정렬 상태를 현재 위치로 고정 */
    var el=document.getElementById("kbscroll");
    if(el) kbScroll=el.scrollLeft;
  }
  render();
}

  lastKeyPointer=Date.now();
  var midi=+el.getAttribute('data-midi');
  if(S.playMode) glissLast[ev.pointerId]=midi;
  toggleKey(midi,el,ev.pointerId);
},{passive:true});
/* 연주 모드: 건반 위를 스르륵 밀면 지나가는 음이 차례로 울림 (손가락마다 독립) */
document.addEventListener('pointermove',function(ev){
  if(!S.playMode||!(ev.pointerId in glissLast)) return;
  var t=document.elementFromPoint(ev.clientX,ev.clientY);
  var k=(t&&t.closest)?t.closest('[data-act="key"]'):null;
  if(!k) return;
  var m=+k.getAttribute('data-midi');
  if(m===glissLast[ev.pointerId]) return;
  glissLast[ev.pointerId]=m;
  releaseKey(ev.pointerId);
  play(m,1.4);
  holdKey(k,ev.pointerId);
},{passive:true});
['pointerup','pointercancel'].forEach(function(t){
  document.addEventListener(t,function(ev){ delete glissLast[ev.pointerId]; },{passive:true});
});

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');
  if(!el) return;
  var a=el.getAttribute('data-act');
  if(a==='key'){
    if(Date.now()-lastKeyPointer<800) return;   /* pointerdown에서 이미 처리 */
    toggleKey(+el.getAttribute('data-midi'),el);
  }
  else if(a==='tune'){ S.tune=el.getAttribute('data-tune'); stopSeq(); render(); }
  else if(a==='sound'){ S.sound=!S.sound; render(); }
  else if(a==='fs'){ toggleFs(); }
  else if(a==='play-mode'){
    releaseAllKeys();
    if(!S.playMode){ snapshotSel(); stopSeq(); S.sel=[]; if(typeof clearQuery==="function") clearQuery(); }
    S.playMode=!S.playMode; resScroll=0; render();
  }
  else if(a==='center'){ centerKeyboard(); applyKbScroll(); }
  else if(a==='oct'){
    var kbe=document.getElementById('kbscroll');
    if(kbe){
      var step=kbe.scrollWidth/3, dir=+el.getAttribute('data-dir');
      var max=kbe.scrollWidth-kbe.clientWidth;
      var to=Math.max(0,Math.min(max,kbe.scrollLeft+dir*step));
      if(kbe.scrollTo) kbe.scrollTo({left:to,behavior:'smooth'}); else kbe.scrollLeft=to;
      kbScroll=to; setTimeout(updateThumb,320);
    }
  }
  else if(a==='restart'){ snapshotSel(); stopSeq(); S.sel=[]; S.moreScale=false; S.moreMode=false; resScroll=0;
                          if(typeof clearQuery==="function") clearQuery(); centerKeyboard(); render(); }
  else if(a==='more-scale'){ S.moreScale=!S.moreScale; render(); }
  else if(a==='more-mode'){ S.moreMode=!S.moreMode; render(); }
  else if(a==='chord'){
    chordPlay(+el.getAttribute('data-root'),
              el.getAttribute('data-ivs').split(',').map(Number),
              el.getAttribute('data-id'));
  }
  else if(a==='play'){
    seqPlay(+el.getAttribute('data-root'),
            el.getAttribute('data-ivs').split(',').map(Number),
            el.getAttribute('data-id'),
            el.getAttribute('data-oct')==='1',
            el.getAttribute('data-desc')==='1');
  }
});

/* 더블탭 확대 방지 (구형 iOS 사파리 보완) */
(function(){
  var last=0;
  document.addEventListener('touchend',function(ev){
    var now=Date.now();
    if(now-last<350) ev.preventDefault();
    last=now;
  },{passive:false});
})();

window.addEventListener('resize',applyKbScroll);
window.addEventListener('orientationchange',function(){ setTimeout(applyKbScroll,150); });

/* ── 직접 입력 · 자동완성 ────────────────────────────── */
var KO_SHARP=["도","도#","레","레#","미","파","파#","솔","솔#","라","라#","시"];
var KO_FLAT =["도","레b","레","미b","미","파","솔b","솔","라b","라","시b","시"];

function norm(x){
  return String(x||"").toLowerCase()
    .replace(/[♯]/g,"#").replace(/[♭]/g,"b")
    .replace(/[\s._\/()]/g,"");
}

/* 루트 이름 목록 (영문 ♯/♭ + 한글 계이름), 긴 이름 우선 */
var ROOTNAMES=(function(){
  var out=[],seen={};
  for(var pc=0;pc<12;pc++){
    [SHARP[pc],FLAT[pc],KO_SHARP[pc],KO_FLAT[pc]].forEach(function(n){
      var k=pc+"|"+norm(n);
      if(!n||seen[k])return; seen[k]=1;
      out.push({pc:pc,name:n,n:norm(n)});
    });
  }
  out.sort(function(a,b){return b.n.length-a.n.length;});
  return out;
})();

/* 검색 카탈로그 */
var CATALOG=(function(){
  var out=[];
  CHORDS.forEach(function(c,i){
    out.push({kind:"chord",order:i,ivs:c.ivs,label:c.sym,sub:c.ko,
      alts:[c.sym,c.ko].concat(c.alt||[]).map(norm)});
  });
  SCALES.forEach(function(x,i){
    out.push({kind:"scale",order:i,ivs:x.ivs,label:x.ko,sub:x.en,
      alts:[x.ko,x.en].concat(x.alt||[]).map(norm)});
  });
  MODES.forEach(function(x,i){
    out.push({kind:"mode",order:i,ivs:x.ivs,label:x.ko,sub:x.en+" · "+x.fam+" 계열",
      alts:[x.ko,x.en].concat(x.alt||[]).map(norm)});
  });
  return out;
})();
var KIND_ORDER={chord:0,scale:1,mode:2};
var KIND_KO={chord:"코드",scale:"스케일",mode:"모드"};

function matchAlt(it,rest){
  var best=-1,i,a;
  for(i=0;i<it.alts.length;i++){
    a=it.alts[i];
    if(rest===a) return 0;                                  /* 완전 일치 */
    if(!rest){ if(best<0) best=1; continue; }                /* 루트만 입력 */
    if(a && a.indexOf(rest)===0){ best=1; }                  /* 앞부분 일치 */
    else if(a && rest.length>=2 && a.indexOf(rest)>0 && best<0){ best=2; }
  }
  return best;
}

function searchQ(raw){
  var q=norm(raw);
  if(!q) return [];
  var out=run(q);
  if(!out.length && q.indexOf("-")>=0) out=run(q.replace(/-/g,""));   /* 하이픈 무시 재시도 */
  return out.slice(0,16);

  function run(q){
    var res=[], seen={};
    function add(pc,it,sc,rlen,flat){
      var key=pc+"|"+it.kind+"|"+it.order, prev=seen[key];
      if(prev){ if(sc<prev.score){ prev.score=sc; prev.rlen=rlen; prev.flat=flat; } return; }
      var o={pc:pc,it:it,score:sc,rlen:rlen,flat:flat};
      seen[key]=o; res.push(o);
    }
    /* 루트 이름으로 시작하는 경우 */
    ROOTNAMES.forEach(function(r){
      if(q.indexOf(r.n)!==0) return;
      var rest=q.slice(r.n.length);
      var flat=(r.name.indexOf("#")>0)?false:
               (r.name.indexOf("b")>0||r.name.indexOf("♭")>0)?true:isFlat(r.pc);
      CATALOG.forEach(function(it){
        var sc=matchAlt(it,rest);
        if(sc>=0) add(r.pc,it,sc,r.n.length,flat);
      });
    });
    /* 루트 없이 종류만 입력한 경우 → C 기준 */
    CATALOG.forEach(function(it){
      var sc=matchAlt(it,q);
      if(sc>=0) add(0,it,sc,0,false);
    });
    res.sort(function(a,b){
      return a.score-b.score || b.rlen-a.rlen ||
             KIND_ORDER[a.it.kind]-KIND_ORDER[b.it.kind] ||
             a.it.order-b.it.order || a.pc-b.pc;
    });
    return res;
  }
}

function sugName(r){
  var f=(r.flat===undefined)?isFlat(r.pc):r.flat, root=nm(r.pc,f);
  return r.it.kind==="chord" ? root+r.it.label : root+" "+r.it.label;
}

var SUG=[], sugIdx=-1;
var qEl,sugEl,clrEl;

function renderSug(){
  if(!sugEl) return;
  if(!SUG.length){
    var v=qEl.value.trim();
    sugEl.innerHTML = v ? '<div class="sgempty">일치하는 코드 · 스케일 · 모드가 없습니다.</div>' : '';
    sugEl.className = v ? "sugg open" : "sugg";
    return;
  }
  var h="";
  SUG.forEach(function(r,i){
    var f=(r.flat===undefined)?isFlat(r.pc):r.flat;
    var notes=r.it.ivs.map(function(iv){return nm(r.pc+iv,f);}).join(" ");
    h+='<div class="sg'+(i===sugIdx?" sel":"")+'" data-sug="'+i+'">'
      +'<span class="sgkind mono k-'+r.it.kind+'">'+KIND_KO[r.it.kind]+'</span>'
      +'<span><span class="sgname mono">'+sugName(r)+'</span>'
      +'<span class="sgko">'+r.it.sub+'</span></span>'
      +'<span class="sgnotes mono">'+notes+'</span></div>';
  });
  sugEl.innerHTML=h;
  sugEl.className="sugg open";
  var sel=sugEl.querySelector(".sg.sel");
  if(sel && sel.scrollIntoView) sel.scrollIntoView({block:"nearest"});
}
function closeSug(){ if(sugEl){ sugEl.className="sugg"; } sugIdx=-1; }
function updateSug(){
  SUG=searchQ(qEl.value);
  sugIdx=SUG.length?0:-1;
  if(clrEl) clrEl.className="sbclr mono"+(qEl.value?" on":"");
  renderSug();
}

/* 선택 → 건반을 누른 것과 동일하게 반영 */
function pickSug(i){
  var r=SUG[i]; if(!r) return;
  var root=r.pc, ivs=r.it.ivs;
  S.playMode=false;
  S.sel=ivs.map(function(iv){return 60+root+iv;});
  S.moreScale=false; S.moreMode=false;
  resScroll=0; centerKeyboard();
  qEl.value=sugName(r);
  if(clrEl) clrEl.className="sbclr mono on";
  addHist({label:sugName(r),kind:r.it.kind,sel:S.sel.slice()});
  closeSug(); qEl.blur();
  stopSeq();
  if(r.it.kind==="chord") chordPlay(root,ivs,"q-chord");
  else seqPlay(root,ivs,"q-seq",true,false);
}

function clearQuery(){
  if(qEl){ qEl.value=""; SUG=[]; closeSug(); }
  if(clrEl) clrEl.className="sbclr mono";
}

function initSearch(){
  qEl=document.getElementById("q");
  sugEl=document.getElementById("sugg");
  clrEl=document.getElementById("qclr");
  if(!qEl) return;

  qEl.addEventListener("input",updateSug);
  qEl.addEventListener("focus",function(){ if(qEl.value) updateSug(); });
  qEl.addEventListener("blur",function(){ setTimeout(closeSug,150); });
  qEl.addEventListener("keydown",function(ev){
    if(ev.key==="ArrowDown"){ ev.preventDefault(); if(SUG.length){ sugIdx=(sugIdx+1)%SUG.length; renderSug(); } }
    else if(ev.key==="ArrowUp"){ ev.preventDefault(); if(SUG.length){ sugIdx=(sugIdx-1+SUG.length)%SUG.length; renderSug(); } }
    else if(ev.key==="Enter"){ ev.preventDefault(); if(sugIdx>=0) pickSug(sugIdx); }
    else if(ev.key==="Escape"){ closeSug(); qEl.blur(); }
  });
  /* pointerdown에서 처리해야 input blur로 항목이 사라지지 않음 */
  sugEl.addEventListener("pointerdown",function(ev){
    var el=ev.target.closest?ev.target.closest("[data-sug]"):null;
    if(!el) return;
    ev.preventDefault();
    pickSug(+el.getAttribute("data-sug"));
  });
  clrEl.addEventListener("click",function(){
    qEl.value=""; SUG=[]; closeSug();
    clrEl.className="sbclr mono";
    qEl.focus();
  });
}
initSearch();


/* ── 히스토리 (새로고침 · 다시 시작에도 유지) ─────────── */
var HKEY="scaleReader.history.v1", HMAX=24, HIST=[];
function loadHist(){
  try{
    var v=JSON.parse(localStorage.getItem(HKEY)||"[]");
    HIST=(Array.isArray(v)?v:[]).filter(function(x){
      return x && typeof x.label==="string" && Array.isArray(x.sel) && x.sel.length &&
             x.sel.every(function(m){return typeof m==="number" && m>=48 && m<=83;});
    }).slice(0,HMAX);
  }catch(e){ HIST=[]; }
}
function saveHist(){ try{ localStorage.setItem(HKEY,JSON.stringify(HIST.slice(0,HMAX))); }catch(e){} }

function addHist(item){
  var key=item.sel.slice().sort(function(a,b){return a-b;}).join(",");
  for(var i=0;i<HIST.length;i++){
    if(HIST[i].sel.slice().sort(function(a,b){return a-b;}).join(",")===key){
      var old=HIST.splice(i,1)[0];            /* 같은 음 조합이면 기존 이름 유지하고 맨 앞으로 */
      HIST.unshift(old); saveHist(); renderHist(); return;
    }
  }
  HIST.unshift({label:item.label,kind:item.kind,sel:item.sel.slice()});
  if(HIST.length>HMAX) HIST.length=HMAX;
  saveHist(); renderHist();
}

/* 현재 건반 선택을 이름으로 */
function selInfo(){
  var pcs=[]; S.sel.forEach(function(m){ if(pcs.indexOf(mod(m))<0) pcs.push(mod(m)); });
  pcs.sort(function(a,b){return a-b;});
  var bass=mod(Math.min.apply(null,S.sel));
  if(pcs.length>=2){
    var c=findChords(pcs,bass);
    if(c.exact.length){
      var e=c.exact[0], f=isFlat(e.root);
      return {label:nm(e.root,f)+e.c.sym+(bass!==e.root?"/"+nm(bass,f):""),kind:"chord"};
    }
  }
  var fl=isFlat(bass);
  return {label:S.sel.map(function(m){return nm(m,fl);}).join(" "),kind:"keys"};
}
function snapshotSel(){
  if(!S.sel.length) return;
  var inf=selInfo();
  addHist({label:inf.label,kind:inf.kind,sel:S.sel.slice()});
}

function renderHist(){
  var sc=document.getElementById("hscroll");
  if(!sc) return;
  if(!HIST.length){
    sc.innerHTML='<span class="hempty">최근 기록 · 입력, 다시 시작, 새로고침 때 여기에 쌓입니다</span>';
  } else {
    sc.innerHTML=HIST.map(function(h,i){
      return '<button class="hc" type="button" data-h="'+i+'"><span class="hd hd-'+(h.kind||"keys")+'"></span>'
            +h.label.replace(/</g,"&lt;")+'</button>';
    }).join("");
  }
  var cb=document.getElementById("hclr");
  if(cb) cb.className="hclr"+(HIST.length?" on":"");
  updHistFade();
}
function updHistFade(){
  var wrap=document.getElementById("hwrap"), sc=document.getElementById("hscroll");
  if(!wrap||!sc) return;
  var l=sc.scrollLeft>2, r=sc.scrollLeft+sc.clientWidth<sc.scrollWidth-2;
  wrap.className="hwrap"+(l?" can-l":"")+(r?" can-r":"");
}

/* 카드 탭 → 그 상태로 복원하고 재생 */
function restoreHist(i){
  var h=HIST[i]; if(!h) return;
  var sel=h.sel.slice().sort(function(a,b){return a-b;});
  stopSeq();
  S.playMode=false;
  S.sel=sel; S.moreScale=false; S.moreMode=false;
  resScroll=0; centerKeyboard();
  if(typeof clearQuery==="function") clearQuery();
  var root=sel[0]-60, ivs=sel.map(function(m){return m-sel[0];});
  if(h.kind==="scale"||h.kind==="mode") seqPlay(root,ivs,"h-seq",true,false);
  else chordPlay(root,ivs,"h-chord");
}

function initHist(){
  loadHist(); renderHist();
  var sc=document.getElementById("hscroll");
  if(!sc) return;
  sc.addEventListener("scroll",updHistFade,{passive:true});
  /* PC: 세로 휠을 가로 이동으로 */
  sc.addEventListener("wheel",function(ev){
    if(Math.abs(ev.deltaY)>Math.abs(ev.deltaX)){ sc.scrollLeft+=ev.deltaY; ev.preventDefault(); }
  },{passive:false});
  sc.addEventListener("click",function(ev){
    var c=ev.target.closest?ev.target.closest("[data-h]"):null;
    if(!c) return;
    restoreHist(+c.getAttribute("data-h"));
  });
  /* 비우기: 실수 방지를 위해 두 번 탭 (2.5초 안에 한 번 더) */
  var cb=document.getElementById("hclr"), ct=document.getElementById("hclrtxt"), armT=null;
  if(cb) cb.addEventListener("click",function(){
    if(cb.className.indexOf("arm")<0){
      cb.className="hclr on arm"; ct.textContent="한 번 더 누르면 삭제";
      clearTimeout(armT);
      armT=setTimeout(function(){ ct.textContent="비우기"; renderHist(); },2500);
      return;
    }
    clearTimeout(armT);
    HIST=[]; saveHist(); ct.textContent="비우기"; renderHist();
  });
  window.addEventListener("resize",updHistFade);
  /* 새로고침 · 탭 닫기 직전의 선택을 기록 */
  window.addEventListener("pagehide",snapshotSel);
  window.addEventListener("beforeunload",snapshotSel);
}
initHist();

/* 스플래시: 1초 노출 후 사라짐 */
(function(){
  var sp=document.getElementById("splash");
  if(!sp) return;
  setTimeout(function(){
    sp.className="out";
    setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); },320);
  },1500);
})();

render();
updHistFade();
</script>
